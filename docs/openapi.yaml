      x-estado: implementado
      x-ticket: API-37
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Pago marcado como no recibido.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          payment:
                            $ref: '#/components/schemas/Payment'
                          summary:
                            $ref: '#/components/schemas/PaymentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pago ya fue respondido (`PAYMENT_ALREADY_RESPONDED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/debt-reminders:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Pagos
      summary: 'Recordarle un adeudo al cliente (proveedor)'
      description: |
        El técnico asignado, el dueño o el gerente de la sucursal le manda al cliente un recordatorio
        de un servicio finalizado con saldo. Máximo uno cada 24 horas por servicio, contando también
        los recordatorios automáticos. No se manda si el cliente ya registró un pago que espera
        confirmación.
      x-estado: implementado
      x-ticket: API-53
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Recordatorio enviado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          request_id:
                            type: string
                          balance_due:
                            $ref: '#/components/schemas/Money'
                          sent_at:
                            type: string
                            format: date-time
                          next_reminder_at:
                            type: string
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            No hay adeudo (`NO_DEBT`), el cliente ya registró un pago por confirmar
            (`PAYMENT_PENDING_CONFIRMATION`) o ya se le recordó en las últimas 24 horas
            (`REMINDER_TOO_SOON`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/payments:
    get:
      tags:
