          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - in: query
          name: before
          schema:
            type: string
            pattern: '^[1-9]\d{0,17}$'
          description: Devuelve mensajes con id menor a este.
        - in: query
          name: after
          schema:
            type: string
            pattern: '^[1-9]\d{0,17}$'
          description: Devuelve mensajes con id mayor a este, en orden cronológico.
      responses:
        '200':
          description: Conversación y página de mensajes.
          content:
