  /api/reports:
    post:
      tags:
        - Reportes
      summary: Levantar un reporte, garantía o reclamación
      description: |
        Lo levanta quien participa en el servicio (cliente, técnico asignado, gerente o proveedor dueño).
        Devuelve el caso con su **folio** (`REP-2026-000123` para reportes, `GAR-` para garantías y `REC-`
        para reclamaciones). La evidencia se sube antes con `POST /api/files/upload` (`category=photos` o
        `evidences`) y aquí se mandan sus llaves en `attachment_keys` (hasta 5: imágenes, video MP4 o PDF).

        Reglas: el servicio debe tener técnico asignado. Las garantías las pide solo el cliente, y las
        garantías y reclamaciones solo proceden con el servicio `completada`. No se puede tener dos casos
        abiertos del mismo tipo para el mismo servicio. Quien reporta recibe un acuse con el folio por
        notificación y push, y el equipo de Soporte lo ve en tiempo real.

        `client_uuid` es opcional: reintentar con el mismo valor devuelve `200` con el caso original.
      x-estado: implementado
      x-ticket: API-40
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportInput'
            examples:
              reporte:
                value:
                  request_id: '501'
                  category: servicio_incompleto
                  description: El técnico se fue sin terminar la instalación del lavabo.
                  attachment_keys:
                    - photos/42/2026/11/lavabo.jpg
              garantia:
                value:
                  request_id: '501'
                  type: garantia
                  category: danos
                  description: A los tres días volvió la fuga en la misma conexión.
      responses:
        '201':
          description: Caso creado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Report'
        '200':
          description: El `client_uuid` ya existía; se devuelve el caso original.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Report'
        '400':
          description: Datos inválidos (`VALIDATION_ERROR`, `INVALID_EVIDENCE_FILE_TYPE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: La evidencia no pertenece a quien reporta (`FILE_NOT_OWNED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El servicio no admite ese caso (`REPORT_NOT_ALLOWED`) o ya hay uno abierto (`REPORT_ALREADY_OPEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Reportes
      summary: Listar reportes
      description: |
        Soporte y Administrador ven todos y pueden filtrar por `assigned_to` (`me` o un id) y buscar por
        folio con `q`. Los demás usuarios ven solo los casos que levantaron.
      x-estado: implementado
      x-ticket: API-40
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [pendiente, en_revision, resuelto, rechazado]
        - in: query
          name: type
          schema:
            type: string
            enum: [reporte, garantia, reclamacion]
        - in: query
          name: category
          schema:
            type: string
            enum: [servicio_incompleto, cobro_indebido, danos, conducta_inapropiada, otro]
        - in: query
          name: priority
          schema:
            type: string
            enum: [baja, media, alta, urgente]
        - in: query
          name: request_id
          schema:
            type: string
        - in: query
          name: assigned_to
          schema:
            type: string
          description: Solo Soporte. `me` o el id de un usuario de Soporte.
        - in: query
          name: q
          schema:
            type: string
          description: Solo Soporte. Folio completo o su parte inicial, por ejemplo `GAR-2026`.
      responses:
        '200':
          description: Página de casos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportListPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/reports/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Reportes
      summary: Detalle del reporte, con evidencia y bitácora
      description: |
        Lo ve quien lo levantó y el equipo de Soporte; para cualquier otra persona no existe (`404`).
        La bitácora (`events`) trae comentarios y cambios de estado en orden cronológico. Quien reportó
        no ve las notas internas ni los nombres de Soporte (aparece "Soporte").
