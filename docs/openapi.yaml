      summary: '[API-20] Subir un certificado del proveedor aprobado'
      description: >-
        El proveedor con la solicitud aprobada sube un certificado nuevo (por defecto, «Certificaciones
        o Títulos Técnicos»). Cada certificado es un documento aparte, queda pendiente hasta que un
        administrador lo revise con `PATCH /api/admin/supplier-documents/{id}` y, ya aprobado, el
        proveedor decide si se muestra con `PATCH /api/supplier-documents/{id}/visibility`.
