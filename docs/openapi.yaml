  /api/search/branches:
    get:
      tags:
        - Búsqueda
      summary: '[Planeado · API-23] Buscar proveedores cercanos'
      description: |
        Sucursales dentro del radio que aceptan solicitudes. Con `available_now` en `true` solo
        las que están dentro de su horario. Por defecto ordena por cercanía y da prioridad a los
        independientes (algoritmo de API-24).
      x-estado: planeado
      x-ticket: API-23
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: lng
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - in: query
          name: radius_km
          schema:
            type: number
            minimum: 1
            maximum: 50
            default: 10
        - in: query
          name: category_id
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - recomendado
              - distancia
              - calificacion
              - precio
            default: recomendado
        - in: query
          name: available_now
          schema:
            type: boolean
            default: false
        - in: query
          name: min_rating
          description: Calificación promedio mínima (0 a 5). Las sucursales sin reseñas cuentan como 0.
          schema:
            type: number
            minimum: 0
            maximum: 5
        - in: query
          name: max_price
          description: >-
            Precio base máximo. Con category_id se compara el precio de ese servicio; sin él, basta con
            que la sucursal tenga algún servicio a ese precio o menos.
          schema:
            type: number
            exclusiveMinimum: 0
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Resultados para el mapa.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BranchSearchResult'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # Planeados · Módulo 5: dispositivos y notificaciones
  # ==========================================================================

  /api/me/devices:
    post:
      tags:
        - Mi cuenta
      summary: '[Planeado · API-16] Registrar el token del dispositivo'
      description: La app lo manda al iniciar sesión. Si el token ya existe, se reasigna a este usuario.
      x-estado: planeado
      x-ticket: API-16
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenInput'
      responses:
        '201':
          description: Token registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/devices/{token}:
    parameters:
      - in: path
