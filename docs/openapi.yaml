        - name: commission_status
          in: query
          schema:
            type: string
            enum: [pendiente, pagada]
        - name: from
          in: query
          description: Desde esta fecha (AAAA-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Hasta esta fecha, incluida (AAAA-MM-DD).
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
