openapi: 3.1.0

info:
  title: Fixora API
  version: 1.0.0
  description: |
    Contrato de la API de Fixora.
    Incluye registro de clientes, verificación de correo,
    autenticación, administración de sesiones y creación
    de usuarios de prueba para desarrollo.

servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo

tags:
  - name: Registro
    description: Registro de clientes y verificación de correo electrónico.
  - name: Autenticación
    description: Inicio de sesión y administración de sesiones.
  - name: Desarrollo
    description: Endpoints disponibles únicamente fuera de producción.
  - name: Categorías
    description: Administración y consulta del catálogo de categorías. 

paths:
  /api/auth/register:
    post:
      tags:
        - Registro
      summary: Registrar cliente
      description: |
        Crea una cuenta con el rol cliente y estado inicial por_verificar.
        Guarda la contraseña mediante hash y los datos personales del cliente.
        Después de crear la cuenta envía un código de verificación de seis dígitos
        al correo proporcionado. No genera tokens durante el registro.
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
            example:
              email: cliente@ejemplo.com
              password: Cliente123*
              name: Juan
              lastname_p: Perez
              lastname_m: Lopez
              birth_date: '2000-05-15'
              phone: '8711234567'
      responses:
        '201':
          description: Cliente registrado y correo de verificación enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterClientResponse'
              example:
                message: Registro completado. Revisa tu correo electrónico para verificar tu cuenta.
                user:
                  id: '42'
                  email: cliente@ejemplo.com
                  role: cliente
                  status: por_verificar
                verification:
                  required: true
                  expiresInMinutes: 10
        '400':
          description: Datos de registro inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: INVALID_INPUT
                    message: Debes proporcionar correo, contraseña, nombre y apellido paterno.
                invalidEmail:
                  value:
                    error: INVALID_EMAIL
                    message: El correo electrónico no tiene un formato válido.
                invalidPassword:
                  value:
                    error: INVALID_PASSWORD
                    message: La contraseña debe tener al menos 8 caracteres y no superar los 72 bytes.
                invalidName:
                  value:
                    error: INVALID_NAME
                    message: El nombre es obligatorio y no puede superar los 100 caracteres.
                invalidLastname:
                  value:
                    error: INVALID_LASTNAME
                    message: El apellido paterno es obligatorio y no puede superar los 100 caracteres.
                invalidPhone:
                  value:
                    error: INVALID_PHONE
                    message: El teléfono no puede superar los 30 caracteres.
                invalidBirthDate:
                  value:
                    error: INVALID_BIRTH_DATE
                    message: La fecha de nacimiento debe tener el formato YYYY-MM-DD y ser válida.
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_REGISTERED
                message: Ya existe una cuenta registrada con este correo electrónico.
        '500':
          description: Error interno o rol cliente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                roleNotFound:
                  value:
                    error: CLIENT_ROLE_NOT_FOUND
                    message: No se encuentra disponible el rol cliente.
                internalError:
                  value:
                    error: INTERNAL_SERVER_ERROR
                    message: Error interno del servidor.
        '503':
          description: La cuenta se creó, pero no fue posible enviar el correo de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_SEND_FAILED
                message: La cuenta fue creada, pero no fue posible enviar el código. Puedes solicitar otro envío.

  /api/auth/verify-email:
    post:
      tags:
        - Registro
      summary: Verificar correo electrónico
      description: |
        Comprueba el código de seis dígitos enviado al correo del cliente.
        El código vence según la configuración del servidor y permite un máximo
        de intentos configurado. Cuando la verificación es correcta, el código
        se consume y el estado de la cuenta cambia de por_verificar a activo.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              email: cliente@ejemplo.com
              code: '123456'
      responses:
        '200':
          description: Correo electrónico verificado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
              example:
                message: Correo electrónico verificado correctamente.
                status: activo
        '400':
          description: Código o datos de verificación inválidos, inexistentes o expirados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: INVALID_INPUT
                    message: Debes proporcionar el correo y el código de verificación.
                invalidCodeFormat:
                  value:
                    error: INVALID_CODE_FORMAT
                    message: El código debe contener exactamente seis dígitos.
                invalidVerification:
                  value:
                    error: INVALID_VERIFICATION
                    message: No existe una cuenta pendiente de verificación para esos datos.
                codeNotFound:
                  value:
                    error: VERIFICATION_CODE_NOT_FOUND
                    message: No existe un código pendiente. Solicita uno nuevo.
                codeExpired:
                  value:
                    error: VERIFICATION_CODE_EXPIRED
                    message: El código ha expirado. Solicita uno nuevo.
                invalidCode:
                  value:
                    error: INVALID_VERIFICATION_CODE
                    message: 'El código es incorrecto. Intentos restantes: 4.'
        '409':
          description: El correo ya fue verificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_VERIFIED
                message: El correo electrónico ya fue verificado.
        '429':
          description: Se alcanzó el máximo de intentos de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VERIFICATION_ATTEMPTS_EXCEEDED
                message: Se alcanzó el máximo de intentos. Solicita un código nuevo.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/resend-verification:
    post:
      tags:
        - Registro
      summary: Reenviar código de verificación
      description: |
        Solicita un nuevo código para una cuenta pendiente de verificación.
        El código pendiente anterior se invalida. El servicio aplica un intervalo
        mínimo entre reenvíos. Para evitar revelar qué correos están registrados,
        las cuentas inexistentes o ya verificadas reciben una respuesta genérica.
      operationId: resendVerificationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: cliente@ejemplo.com
      responses:
        '200':
          description: Solicitud procesada; si la cuenta está pendiente, se envió un nuevo código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
              examples:
                sent:
                  value:
                    message: Se ha enviado un nuevo código de verificación.
                    verification:
                      expiresInMinutes: 10
                      resendAvailableInSeconds: 60
                generic:
                  value:
                    message: Si existe una cuenta pendiente de verificación, recibirás un correo con las instrucciones.
        '400':
          description: Correo electrónico inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_EMAIL
                message: Debes proporcionar un correo electrónico válido.
        '429':
          description: Todavía no ha transcurrido el intervalo mínimo para reenviar el código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: RESEND_COOLDOWN
                message: Espera 35 segundos antes de solicitar otro código.
        '503':
          description: No fue posible enviar el correo de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_SEND_FAILED
                message: No fue posible enviar el correo de verificación. Intenta nuevamente.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Autentica al usuario mediante correo y contraseña.
        La cuenta debe estar activa y su rol habilitado.
        Devuelve un token de acceso y un token de renovación.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: cliente@fixora.com
              password: MiContrasena123
      responses:
        '200':
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: Correo o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_CREDENTIALS
                message: Correo o contraseña incorrectos.
        '403':
          description: Cuenta no habilitada o rol desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountNotActive:
                  summary: Cuenta inactiva
                  value:
                    error: ACCOUNT_NOT_ACTIVE
                    message: La cuenta no está habilitada para iniciar sesión.
                roleInactive:
                  summary: Rol desactivado
                  value:
                    error: ROLE_INACTIVE
                    message: El rol de esta cuenta está desactivado.
        '423':
          description: Cuenta bloqueada temporalmente por intentos fallidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ACCOUNT_TEMPORARILY_LOCKED
                message: La cuenta está bloqueada temporalmente. Intenta más tarde.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renovar sesión
      description: |
        Genera un nuevo par de tokens y rota el token de renovación.
        El token de renovación anterior deja de ser válido después
        de una renovación exitosa.
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Sesión renovada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/RefreshTokenRequired'
        '401':
          description: Token inválido, sesión expirada o token ya utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  value:
                    error: INVALID_REFRESH_TOKEN
                    message: El token de renovación no es válido o ha expirado.
                invalidSession:
                  value:
                    error: INVALID_SESSION
                    message: La sesión no es válida o ha expirado.
        '403':
          description: Cuenta no habilitada o rol desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: |
        Revoca la sesión asociada al token de renovación proporcionado.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Sesión cerrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                message: Sesión cerrada correctamente.
        '400':
          $ref: '#/components/responses/RefreshTokenRequired'
        '401':
          description: Token de renovación inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  value:
                    error: INVALID_REFRESH_TOKEN
                    message: El token de renovación no es válido o ha expirado.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dev/users:
    post:
      tags:
        - Desarrollo
      summary: Crear usuario de prueba
      description: |
        Crea un usuario para probar la autenticación.
        Este endpoint solo está disponible cuando NODE_ENV
        no tiene el valor production.
      operationId: createTestUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestUserRequest'
            example:
              email: cliente.prueba@fixora.test
              password: Fixora123!
              role: cliente
              status: activo
      responses:
        '201':
          description: Usuario de prueba creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTestUserResponse'
        '400':
          description: Datos, rol o estado inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: INVALID_INPUT
                    message: Debes proporcionar email y password como cadenas de texto no vacías.
                invalidRole:
                  value:
                    error: INVALID_ROLE
                    message: El rol especificado no es válido.
                    availableRoles:
                      - administrador
                      - soporte
                      - cliente
                      - proveedor
                      - gerente
                      - empleado
                invalidStatus:
                  value:
                    error: INVALID_STATUS
                    message: El estado especificado no es válido.
                    availableStatuses:
                      - activo
                      - por_verificar
                      - por_aprobar
        '403':
          description: Creación de usuarios de prueba deshabilitada o rol no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                disabled:
                  value:
                    error: TEST_USERS_DISABLED
                    message: La creación de usuarios de prueba está deshabilitada.
                roleNotFound:
                  value:
                    error: ROLE_NOT_FOUND
                    message: El rol solicitado no existe o está desactivado.
        '409':
          description: Ya existe un usuario con ese correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_EXISTS
                message: El correo ya está registrado.
        '500':
          $ref: '#/components/responses/InternalServerError'

          
  /api/categories:
    get:
      tags:
        - Categorías
      summary: Consultar categorías activas
      description: Consulta pública del catálogo de categorías.
      responses:
        '200':
          description: Categorías obtenidas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        '500':
          description: Error interno del servidor.

    post:
      tags:
        - Categorías
      summary: Crear una categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
            example:
              name: Plomería
              slug: plomeria
              icon_key: icons/plomeria.svg
              sort_order: 1
              active: true
      responses:
        '201':
          description: Categoría creada correctamente.
        '400':
          description: Datos inválidos.
        '401':
          description: No autenticado.
        '403':
          description: No tienes permisos de Administrador.
        '409':
          description: El slug ya existe.

  /api/categories/admin/all:
    get:
      tags:
        - Categorías
      summary: Consultar todas las categorías
      description: Consulta administrativa de categorías activas e inactivas.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filtrar por nombre de categoría.
      responses:
        '200':
          description: Listado obtenido correctamente.
        '401':
          description: No autenticado.
        '403':
          description: Acceso denegado.

  /api/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identificador BIGINT de la categoría.

    get:
      tags:
        - Categorías
      summary: Consultar una categoría activa
      responses:
        '200':
          description: Categoría obtenida correctamente.
        '400':
          description: Identificador inválido.
        '404':
          description: Categoría no encontrada.

    patch:
      tags:
        - Categorías
      summary: Actualizar una categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              name: Plomería residencial
              icon_key: icons/plomeria.svg
              sort_order: 5
              active: true
      responses:
        '200':
          description: Categoría actualizada correctamente.
        '400':
          description: Datos inválidos.
        '401':
          description: No autenticado.
        '403':
          description: Acceso denegado.
        '404':
          description: Categoría no encontrada.
        '409':
          description: Slug duplicado.

    delete:
      tags:
        - Categorías
      summary: Desactivar una categoría
      description: Desactivación lógica; el registro no se elimina físicamente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categoría desactivada correctamente.
        '401':
          description: No autenticado.
        '403':
          description: Acceso denegado.
        '404':
          description: Categoría no encontrada.
        '409':
          description: La categoría ya está desactivada.


components:
  schemas:
    RegisterClientRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - name
        - lastname_p
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Correo electrónico que se registrará en Fixora.
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña de al menos 8 caracteres y máximo 72 bytes en UTF-8.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre del cliente.
        lastname_p:
          type: string
          minLength: 1
          maxLength: 100
          description: Apellido paterno del cliente.
        lastname_m:
          type: [string, 'null']
          maxLength: 100
          description: Apellido materno (opcional).
        birth_date:
          type: [string, 'null']
          format: date
          description: Fecha de nacimiento en formato YYYY-MM-DD (opcional).
        phone:
          type: [string, 'null']
          maxLength: 30
          description: Número telefónico (opcional).

    RegisterClientResponse:
      type: object
      required:
        - message
        - user
        - verification
      properties:
        message:
          type: string
          example: Registro completado. Revisa tu correo electrónico para verificar tu cuenta.
        user:
          type: object
          required:
            - id
            - email
            - role
            - status
          properties:
            id:
              type: string
              example: '42'
            email:
              type: string
              format: email
              example: cliente@ejemplo.com
            role:
              type: string
              const: cliente
            status:
              type: string
              const: por_verificar
        verification:
          type: object
          required:
            - required
            - expiresInMinutes
          properties:
            required:
              type: boolean
              const: true
            expiresInMinutes:
              type: integer
              example: 10

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
          description: Código numérico de seis dígitos recibido por correo.

    VerifyEmailResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          example: Correo electrónico verificado correctamente.
        status:
          type: string
          const: activo

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Correo electrónico de la cuenta pendiente de verificación.

    ResendVerificationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Se ha enviado un nuevo código de verificación.
        verification:
          type: object
          description: Se incluye cuando se genera y envía un nuevo código.
          required:
            - expiresInMinutes
            - resendAvailableInSeconds
          properties:
            expiresInMinutes:
              type: integer
              example: 10
            resendAvailableInSeconds:
              type: integer
              example: 60

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Correo registrado en Fixora.
        password:
          type: string
          format: password
          minLength: 1
          description: Contraseña de la cuenta.

    LoginResponse:
      type: object
      required:
        - message
        - user
        - tokens
      properties:
        message:
          type: string
          example: Inicio de sesión exitoso.
        user:
          $ref: '#/components/schemas/PublicUser'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    PublicUser:
      type: object
      required:
        - id
        - email
        - role
        - status
      properties:
        id:
          type: string
          description: Identificador del usuario como cadena.
          example: '42'
        email:
          type: string
          format: email
          example: cliente@fixora.com
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          description: Estado actual de la cuenta.
          example: activo

    UserRole:
      type: string
      enum:
        - administrador
        - soporte
        - cliente
        - proveedor
        - gerente
        - empleado

    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT utilizado para autenticar solicitudes protegidas.
        refreshToken:
          type: string
          description: JWT utilizado para renovar la sesión.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: string
          description: Duración configurada del token de acceso.
          example: 15m

    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Token de renovación vigente.

    RefreshResponse:
      type: object
      required:
        - message
        - tokens
      properties:
        message:
          type: string
          example: Sesión renovada correctamente.
        tokens:
          $ref: '#/components/schemas/TokenPair'

    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Sesión cerrada correctamente.

    CreateTestUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        role:
          $ref: '#/components/schemas/UserRole'
          default: cliente
        status:
          type: string
          enum:
            - activo
            - por_verificar
            - por_aprobar
          default: activo

    CreateTestUserResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Usuario de prueba creado correctamente.
        user:
          type: object
          required:
            - id
            - email
            - role
            - status
          properties:
            id:
              type: string
              example: '42'
            email:
              type: string
              format: email
              example: cliente.prueba@fixora.test
            role:
              $ref: '#/components/schemas/UserRole'
            status:
              type: string
              enum:
                - activo
                - por_verificar
                - por_aprobar

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código de error estable para el cliente.
          example: INVALID_INPUT
        message:
          type: string
          description: Descripción legible del error.
          example: La solicitud contiene datos inválidos.
        availableRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        availableStatuses:
          type: array
          items:
            type: string
            enum:
              - activo
              - por_verificar
              - por_aprobar

    Category:
      type: object
      properties:
        UniqueID:
          type: string
          example: "1"
        name:
          type: string
          example: Plomería
        slug:
          type: string
          example: plomeria
        active:
          type: boolean
          example: true
        icon_key:
          type:
            - string
            - 'null'
          example: icons/plomeria.svg
        sort_order:
          type: integer
          example: 1

    CategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        slug:
          type: string
          maxLength: 150
        icon_key:
          type:
            - string
            - 'null'
          maxLength: 500
        sort_order:
          type: integer
          minimum: 0
        active:
          type: boolean

    CategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        slug:
          type: string
          maxLength: 150
        icon_key:
          type:
            - string
            - 'null'
          maxLength: 500
        sort_order:
          type: integer
          minimum: 0
        active:
          type: boolean

    CategoriesResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

  responses:
    InvalidInput:
      description: Faltan datos obligatorios o tienen un formato inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_INPUT
            message: Debes proporcionar email y password como cadenas de texto no vacías.

    RefreshTokenRequired:
      description: No se proporcionó un token de renovación válido como texto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: REFRESH_TOKEN_REQUIRED
            message: Debes proporcionar el token de renovación.

    InternalServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INTERNAL_SERVER_ERROR
            message: Error interno del servidor.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
