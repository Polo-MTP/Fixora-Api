        '404':
          $ref: '#/components/responses/NotFound'

  /api/reports/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Reportes
      summary: Comentar en la bitácora
      description: |
        Quien reportó y Soporte pueden comentar. Un comentario de Soporte avisa a quien reportó por
        notificación y push. Soporte puede dejar una **nota interna** con `internal: true`: no la ve
        quien reportó y no genera aviso. Quien reportó no puede comentar un caso ya cerrado.
      x-estado: implementado
      x-ticket: API-40
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCommentInput'
      responses:
        '201':
          description: Comentario agregado.
          content:
