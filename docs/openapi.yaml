            format: date
        - name: days
          in: query
          description: Cuántos días (1 para el día, 7 para la semana; máximo 31).
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 1
        - name: branch_id
          in: query
          schema:
            type: string
        - name: employee_id
          in: query
          schema:
            type: string
      responses:
