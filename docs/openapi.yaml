        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El pago ya fue respondido (`PAYMENT_ALREADY_RESPONDED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/payments/{paymentId}/reject:
    parameters:
