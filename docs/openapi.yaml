        `documentacion_incompleta` piden comentario. Emite el evento «solicitud resuelta» y se
        avisa al proveedor por correo.
      x-estado: planeado
      x-ticket: API-13
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationResolution'
      responses:
        '200':
          description: Solicitud resuelta.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
