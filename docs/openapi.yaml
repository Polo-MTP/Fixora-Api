      summary: '[Planeado · API-27] Crear una solicitud normal o agendada'
      description: |
        Sin `scheduled_at` queda `pendiente` y corre el temporizador de 5 minutos (`expires_at`).
        Con `scheduled_at` también espera la respuesta del proveedor; al aceptarla pasa a `agendada`.
        `client_uuid` evita duplicados si la app reintenta: con el mismo valor se regresa la misma solicitud.
      x-estado: planeado
      x-ticket: API-27
      security:
