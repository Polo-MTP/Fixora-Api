      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF o imagen.
                type_document_id:
                  type: string
                  description: Opcional. Debe ser un tipo no obligatorio y publicable.
                due_date:
                  type: string
