  /api/admin/staff:
    post:
      tags:
        - Administración
      summary: Dar de alta un administrador o soporte
      description: >
        Permite al administrador principal crear una cuenta
        de Administrador o Soporte. La cuenta se crea activa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminStaffCreate'
            example:
              email: user@example.com
              password: stringst
              name: Ana
              lastname_p: Pérez
              lastname_m: López
              role: administrador
              phone: '5512345678'
      responses:
        '201':
          description: Cuenta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStaffResponse'
              example:
                success: true
                message: Operación realizada correctamente.
                data:
                  id: '12'
                  email: user@example.com
                  role: administrador
                  state: activo
                  name: Ana
                  lastname_p: Pérez
                  lastname_m: López
                  birth_date: null
                  phone: '5512345678'
        '400':
          description: Los datos no cumplen el contrato.
          content:
            application/json:
              example:
                error: VALIDATION_ERROR
                message: Los datos enviados no son válidos.
                details:
                  - field: phone
                    message: El teléfono debe tener 10 dígitos.
                availableRoles:
                  - administrador
                  - soporte
                availableStatuses:
                  - activo
        '401':
          description: Falta el token, no es válido o la sesión terminó.
          content:
            application/json:
              example:
                error: INVALID_ACCESS_TOKEN
                message: El token no es válido o ha expirado.
        '403':
          description: La cuenta no tiene permiso para esta acción.
          content:
            application/json:
              example:
                error: INSUFFICIENT_PERMISSIONS
                message: No tienes permisos para realizar esta acción.
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              example:
                error: EMAIL_ALREADY_REGISTERED
                message: El correo ya está registrado.

