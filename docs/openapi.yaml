  /api/service-requests/{id}/chat:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Chat
      summary: Conversación y mensajes de la solicitud
      description: |
        Disponible desde que un técnico acepta la solicitud. Pueden consultarla el cliente, el técnico
        asignado, el gerente de la sucursal y el proveedor dueño de la sucursal. Un técnico al que solo
        se le avisó de la solicitud no tiene acceso.

        Sin parámetros devuelve los últimos mensajes en orden cronológico. Para cargar mensajes más
        viejos usa `before` con el `next_before` de la respuesta. Después de una desconexión, `after`
        con el id del último mensaje recibido devuelve los que faltan. `before` y `after` no se combinan.

        Cuando la solicitud termina (completada, cancelada) el chat queda de solo lectura
        (`can_send: false`). No marca mensajes como leídos: eso se hace con `POST .../chat/read`.
      x-estado: implementado
      x-ticket: API-35
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - in: query
          name: before
          schema:
            type: string
            pattern: '^[1-9]\d{0,17}$'
          description: Devuelve mensajes con id menor a este.
        - in: query
          name: after
          schema:
            type: string
            pattern: '^[1-9]\d{0,17}$'
          description: Devuelve mensajes con id mayor a este, en orden cronológico.
      responses:
        '200':
          description: Conversación y página de mensajes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La solicitud aún no tiene técnico o ya no tiene chat (`CHAT_NOT_AVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/chat/messages:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Chat
      summary: Enviar un mensaje
      description: |
        Texto, fotografías o ambos. Las fotografías se suben antes con `POST /api/files/upload` usando
        `category=photos` y aquí se mandan sus llaves en `attachment_keys` (hasta 5, JPEG, PNG o WebP,
        subidas por quien escribe).

        `client_uuid` evita duplicados: si la app reintenta con el mismo valor, la API responde `200`
        con el mensaje original en lugar de crear otro. El mensaje se entrega en tiempo real por el
        WebSocket a la sala `chats:<id>`; si el destinatario no tiene la app conectada, recibe un push.
      x-estado: implementado
      x-ticket: API-35
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageInput'
            examples:
              texto:
                value:
                  client_uuid: 3f2b8c1e-5a47-4d0b-9c1a-7e6f2d4b8a10
                  message: Ya voy en camino, llego en 10 minutos.
              respuestaConFoto:
                value:
                  client_uuid: 9a1d6b3c-2e58-4f7a-8b0d-1c4e5f6a7b8c
                  message: Así está la fuga.
                  reply_to_id: '15'
                  attachment_keys:
                    - photos/42/2026/11/fuga.jpg
      responses:
        '201':
          description: Mensaje creado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatMessage'
        '200':
          description: El `client_uuid` ya existía; se devuelve el mensaje original.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Datos inválidos (`VALIDATION_ERROR`, `INVALID_REPLY_TARGET`, `INVALID_ATTACHMENT_TYPE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: La fotografía no pertenece a quien escribe (`FILE_NOT_OWNED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El chat no está disponible (`CHAT_NOT_AVAILABLE`) o la solicitud terminó (`CHAT_CLOSED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/chat/read:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Chat
      summary: Marcar mensajes como leídos
      description: |
        Marca como leídos los mensajes de la otra parte. Sin cuerpo marca todos; con `up_to_message_id`
        marca hasta ese mensaje. Quien escribió cada mensaje recibe `chat_messages_read` por el WebSocket.
      x-estado: implementado
      x-ticket: API-35
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                up_to_message_id:
                  type: string
                  pattern: '^[1-9]\d{0,17}$'
      responses:
        '200':
          description: Mensajes marcados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          marked:
                            type: integer
                          message_ids:
                            type: array
                            items:
                              type: string
                          read_at:
                            type:
                              - string
                              - 'null'
                            format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El chat no está disponible (`CHAT_NOT_AVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Reseñas
      summary: Reseñas de la solicitud y si ya puedes calificar
      description: |
        Para quienes participan en la solicitud (cliente, técnico asignado, gerente y proveedor dueño).
        Devuelve las reseñas de ambos sentidos que ya existan. `can_review` es verdadero cuando la
        solicitud está finalizada y quien consulta aún no calificó en su sentido.
      x-estado: implementado
      x-ticket: API-39
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Reseñas de la solicitud.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RequestReviews'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Reseñas
      summary: Calificar la solicitud
      description: |
        Estrellas de 1 a 5, comentario opcional y evidencia opcional (hasta 3 archivos). El sentido sale
        de quién escribe: el cliente califica al proveedor (`cliente_a_proveedor`) y el equipo del
        proveedor (técnico asignado, gerente o dueño) califica al cliente (`proveedor_a_cliente`).
        Solo se puede con la solicitud en estado `completada`, y una vez por sentido.

        La evidencia se sube antes con `POST /api/files/upload` (`category=photos` o `evidences`) y aquí
        se mandan sus llaves. Al guardar, un observador recalcula `rating_avg` y `reviews_count` del
        usuario reseñado y, si la reseña es del cliente, también los de la sucursal; la respuesta ya
        refleja el nuevo promedio en la ficha pública.

        `client_uuid` es opcional: reintentar con el mismo valor devuelve `200` con la reseña original.
      x-estado: implementado
      x-ticket: API-39
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewInput'
            examples:
              clienteConEvidencia:
                value:
                  rating: 5
                  comment: Llegó puntual y dejó todo limpio.
                  attachment_keys:
                    - photos/42/2026/11/resultado.jpg
                  client_uuid: 3f2b8c1e-5a47-4d0b-9c1a-7e6f2d4b8a10
              soloEstrellas:
                value:
                  rating: 4
      responses:
        '201':
          description: Reseña guardada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Review'
        '200':
          description: El `client_uuid` ya existía; se devuelve la reseña original.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Review'
        '400':
          description: Datos inválidos (`VALIDATION_ERROR`, `INVALID_EVIDENCE_FILE_TYPE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: La evidencia no pertenece a quien escribe (`FILE_NOT_OWNED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La solicitud no está finalizada o no tiene técnico (`REVIEW_NOT_ALLOWED`), ya hay una reseña en ese sentido (`REVIEW_ALREADY_EXISTS`) o el `client_uuid` ya se usó en otra reseña (`CLIENT_UUID_IN_USE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/branches/{id}/reviews:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Reseñas
      summary: Reseñas de clientes sobre una sucursal (público)
      description: |
        No requiere sesión. De la más nueva a la más vieja, solo reseñas publicadas de clientes. La ficha
        pública (`GET /api/branches/{id}/public`) ya trae la primera página en `reviews`; este endpoint
        sirve para "ver más".
      x-estado: implementado
      x-ticket: API-39
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Página de reseñas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BranchReviewsPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/reports/{reportId}/conversation:
    parameters:
      - in: path
        name: reportId
        required: true
        schema:
          type: string
          pattern: '^[1-9]\d{0,17}$'
    get:
      tags:
        - Chat
      summary: Conversación de la solicitud de un reporte (Soporte)
      description: |
        Solo lectura para Soporte y Administrador. Devuelve la conversación de la solicitud ligada al
        reporte, con la misma paginación que el chat. No permite escribir ni marca mensajes como leídos.
        Si el reporte no tiene solicitud o la solicitud nunca tuvo chat, `conversation` es `null` y
        `messages` va vacío.
      x-estado: implementado
      x-ticket: API-35
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: after
          schema:
            type: string
      responses:
        '200':
          description: Conversación del reporte.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReportConversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string
        pattern: '^[1-9]\d{0,17}$'
      description: Identificador BIGINT como texto.

    FileKeyQuery:
      in: query
      name: key
      required: true
      schema:
        type: string
      description: El `file_key` firmado.

    FileExpiresQuery:
      in: query
      name: expires
      required: true
      schema:
        type: integer
      description: Vencimiento del enlace, en milisegundos desde 1970.

    FileSignatureQuery:
      in: query
      name: signature
      required: true
      schema:
        type: string

    FileDispositionQuery:
      in: query
      name: disposition
      schema:
        type: string
        enum:
          - inline
          - attachment
      description: Con la que se firmó el enlace.

    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    RegisterClientRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - name
        - lastname_p
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Correo electrónico que se registrará en Fixora.
        password:
          type: string
          format: password
          minLength: 8
          description: Contraseña de al menos 8 caracteres y máximo 72 bytes en UTF-8.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre del cliente.
        lastname_p:
          type: string
          minLength: 1
          maxLength: 100
          description: Apellido paterno del cliente.
        lastname_m:
          type: [string, 'null']
          maxLength: 100
          description: Apellido materno (opcional).
        birth_date:
          type: [string, 'null']
          format: date
          description: Fecha de nacimiento en formato YYYY-MM-DD (opcional).
        phone:
          type: [string, 'null']
          maxLength: 30
          description: Número telefónico (opcional).

    RegisterClientResponse:
      type: object
      required:
        - message
        - user
        - verification
      properties:
        message:
          type: string
          example: Registro completado. Revisa tu correo electrónico para verificar tu cuenta.
        user:
          type: object
          required:
            - id
            - email
            - role
            - status
          properties:
            id:
              type: string
              example: '42'
            email:
              type: string
              format: email
              example: cliente@ejemplo.com
            role:
              type: string
              const: cliente
            status:
              type: string
              const: por_verificar
        verification:
          type: object
          required:
            - required
            - expiresInMinutes
          properties:
            required:
              type: boolean
              const: true
            expiresInMinutes:
              type: integer
              example: 10

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'
          description: Código numérico de seis dígitos recibido por correo.

    VerifyEmailResponse:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          example: Correo electrónico verificado correctamente.
        status:
          type: string
          const: activo

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Correo electrónico de la cuenta pendiente de verificación.

    ResendVerificationResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Se ha enviado un nuevo código de verificación.
        verification:
          type: object
          description: Se incluye cuando se genera y envía un nuevo código.
          required:
            - expiresInMinutes
            - resendAvailableInSeconds
          properties:
            expiresInMinutes:
              type: integer
              example: 10
            resendAvailableInSeconds:
              type: integer
              example: 60

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Correo registrado en Fixora.
        password:
          type: string
          format: password
          minLength: 1
          description: Contraseña de la cuenta.

    LoginResponse:
      type: object
      required:
        - message
        - user
        - tokens
      properties:
        message:
          type: string
          example: Inicio de sesión exitoso.
        user:
          $ref: '#/components/schemas/PublicUser'
        tokens:
          $ref: '#/components/schemas/TokenPair'

    PublicUser:
      type: object
      required:
        - id
        - email
        - role
        - status
      properties:
        id:
          type: string
          description: Identificador del usuario como cadena.
          example: '42'
        email:
          type: string
          format: email
          example: cliente@fixora.com
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          type: string
          description: Estado actual de la cuenta.
          example: activo

    UserRole:
      type: string
      enum:
        - administrador
        - soporte
        - cliente
        - proveedor
        - gerente
        - empleado

    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT utilizado para autenticar solicitudes protegidas.
        refreshToken:
          type: string
          description: JWT utilizado para renovar la sesión.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: string
          description: Duración configurada del token de acceso.
          example: 15m

    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          description: Token de renovación vigente.

    RefreshResponse:
      type: object
      required:
        - message
        - tokens
      properties:
        message:
          type: string
          example: Sesión renovada correctamente.
        tokens:
          $ref: '#/components/schemas/TokenPair'

    LogoutResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Sesión cerrada correctamente.

    CreateTestUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        role:
          $ref: '#/components/schemas/UserRole'
          default: cliente
        status:
          type: string
          enum:
            - activo
            - por_verificar
            - por_aprobar
          default: activo

    CreateTestUserResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: Usuario de prueba creado correctamente.
        user:
          type: object
          required:
            - id
            - email
            - role
            - status
          properties:
            id:
              type: string
              example: '42'
            email:
              type: string
              format: email
              example: cliente.prueba@fixora.test
            role:
              $ref: '#/components/schemas/UserRole'
            status:
              type: string
              enum:
                - activo
                - por_verificar
                - por_aprobar

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Código de error estable para el cliente.
          example: INVALID_INPUT
        message:
          type: string
          description: Descripción legible del error.
          example: La solicitud contiene datos inválidos.
        availableRoles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        availableStatuses:
          type: array
          items:
            type: string
            enum:
              - activo
              - por_verificar
              - por_aprobar

    Category:
      type: object
      properties:
        id:
          type: string
          description: Identificador único de la categoría.
          example: '123'
        name:
          type: string
          example: 'Plomería'
        slug:
          type: string
          example: 'plomeria'
        icon_key:
          type:
            - string
            - 'null'
          example: 'wrench'
        sort_order:
          type: integer
          example: 1
        active:
          type: boolean
          example: true
      required:
        - id
        - name
        - slug
        - sort_order
        - active

    CategoryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: 'Plomería'
        slug:
          type: string
          maxLength: 150
          example: 'plomeria'
        icon_key:
          type:
            - string
            - 'null'
          maxLength: 500
          example: 'wrench'
        sort_order:
          type: integer
          minimum: 0
          default: 0
          example: 1
        active:
          type: boolean
          default: true
          example: true

    CategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: 'Instalaciones hidráulicas'
        slug:
          type: string
          maxLength: 150
          example: 'instalaciones-hidraulicas'
        icon_key:
          type:
            - string
            - 'null'
          maxLength: 500
          example: 'wrench'
        sort_order:
          type: integer
          minimum: 0
          example: 2
        active:
          type: boolean
          example: true

    CategoriesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Categorías obtenidas correctamente.'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - success
        - message
        - data

    CategoryErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - CATEGORY_INVALID_ID
            - CATEGORY_NOT_FOUND
            - CATEGORY_SLUG_TAKEN
            - CATEGORY_INVALID_INPUT
            - CATEGORY_ALREADY_INACTIVE
            - INTERNAL_SERVER_ERROR
          example: CATEGORY_NOT_FOUND
        message:
          type: string
          example: 'Categoría no encontrada.'
      required:
        - error
        - message

    AdminStaffCreate:
      type: object
      required:
        - email
        - password
        - name
        - lastname_p
        - role
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        name:
          type: string
          maxLength: 100
        lastname_p:
          type: string
          maxLength: 100
        lastname_m:
          type:
            - string
            - 'null'
          maxLength: 100
        role:
          type: string
          enum:
            - administrador
            - soporte
        birth_date:
          type:
            - string
            - 'null'
          format: date
        phone:
          type:
            - string
            - 'null'
          pattern: '^[0-9]{10}$'

    AdminStaffResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación realizada correctamente.
        data:
          type: object
          properties:
            id:
              type: string
              example: '12'
            email:
              type: string
              format: email
            role:
              type: string
              enum:
                - administrador
                - soporte
            state:
              type: string
              enum:
                - activo
            name:
              type: string
            lastname_p:
              type: string
            lastname_m:
              type:
                - string
                - 'null'
            birth_date:
              type:
                - string
                - 'null'
              format: date
            phone:
              type:
                - string
                - 'null'
    # ------------------------------------------------------------------------
    # Convenciones comunes
    # ------------------------------------------------------------------------

    SuccessEnvelope:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operación realizada correctamente.

    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          example: 57
        total_pages:
          type: integer
          minimum: 0
          example: 3

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - message
                properties:
                  field:
                    type: string
                    example: phone
                  message:
                    type: string
                    example: El teléfono debe tener 10 dígitos.

    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Cantidad en pesos como texto decimal.
      example: '350.00'

    # ------------------------------------------------------------------------
    # Sistema y usuarios
    # ------------------------------------------------------------------------

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        environment:
          type: string
          example: development
        database:
          type: string
          enum:
            - connected
            - error
        redis:
          type: string
          enum:
            - connected
            - error
        uptime:
          type: number
          description: Segundos desde que arrancó el proceso.
          example: 152.3
        timestamp:
          type: string
          format: date-time

    AdminUser:
      type: object
      description: Cuenta tal como la regresa hoy `/api/users` (todavía con `UniqueID` y `role_id`).
      properties:
        UniqueID:
          type: string
          example: '12'
        email:
          type: string
          format: email
        role_id:
          type: string
          example: '1'
        state:
          $ref: '#/components/schemas/UserState'

    UserState:
      type: string
      enum:
        - por_verificar
        - por_aprobar
        - activo
        - suspendido
        - inactivo

    # ------------------------------------------------------------------------
    # Mi cuenta
    # ------------------------------------------------------------------------

    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: ana@correo.com

    ResetPasswordRequest:
      type: object
      required:
        - email
        - code
        - new_password
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
          example: '482913'
        new_password:
          type: string
          minLength: 8
          maxLength: 72

    Profile:
      type: object
      required:
        - id
        - email
        - role
        - state
        - name
        - lastname_p
      properties:
        id:
          type: string
          example: '12'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        state:
          $ref: '#/components/schemas/UserState'
        name:
          type: string
          example: Ana
        lastname_p:
          type: string
          example: Pérez
        lastname_m:
          type:
            - string
            - 'null'
          example: López
        birth_date:
          type:
            - string
            - 'null'
          format: date
          example: '2000-05-10'
        phone:
          type:
            - string
            - 'null'
          example: '5512345678'

    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        lastname_p:
          type: string
          minLength: 1
          maxLength: 100
        lastname_m:
          type:
            - string
            - 'null'
          maxLength: 100
        birth_date:
          type: string
          format: date
        phone:
          type: string
          pattern: '^\d{10}$'

    PasswordChange:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 72

    AddressInput:
      type: object
      required:
        - street
        - num_ext
        - colony
        - municipality
        - state
        - postal_code
        - latitude
        - longitude
      properties:
        alias:
          type: string
          maxLength: 100
          example: Casa
        reference:
          type: string
          maxLength: 255
          example: Portón negro, junto a la tienda.
        street:
          type: string
          maxLength: 255
          example: Av. Juárez
        num_ext:
          type: string
          maxLength: 50
          example: '120'
        num_int:
          type: string
          maxLength: 50
          example: 3B
        colony:
          type: string
          maxLength: 150
          example: Centro
        municipality:
          type: string
          maxLength: 150
          example: Cuauhtémoc
        state:
          type: string
          maxLength: 150
          example: Ciudad de México
        postal_code:
          type: string
          pattern: '^\d{5}$'
          example: '06000'
        country:
          type: string
          default: México
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 19.4326
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: -99.1332
        is_main:
          type: boolean
          default: false

    AddressUpdate:
      type: object
      minProperties: 1
      description: Los mismos campos de `AddressInput`, todos opcionales.
      properties:
        alias:
          type: string
        reference:
          type: string
        street:
          type: string
        num_ext:
          type: string
        num_int:
          type: string
        colony:
          type: string
        municipality:
          type: string
        state:
          type: string
        postal_code:
          type: string
          pattern: '^\d{5}$'
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number

    Address:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              example: '31'
        - $ref: '#/components/schemas/AddressInput'

    MyAccount:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              example: '16'
            email:
              type: string
              format: email
            role:
              $ref: '#/components/schemas/UserRole'
            state:
              $ref: '#/components/schemas/UserState'
        personal_data:
          description: '`null` si la cuenta todavía no tiene datos personales.'
          oneOf:
            - $ref: '#/components/schemas/PersonalData'
            - type: 'null'
        photo_url:
          type:
            - string
            - 'null'
        active_service:
          type: boolean
          description: >-
            [API-55] La cuenta tiene un servicio aceptado que no ha terminado, como cliente o como
            técnico. Mientras sea true, el nombre, la foto y el vehículo no se pueden cambiar.

    PersonalData:
      type: object
      properties:
        name:
          type: string
          example: Ana
        lastname_p:
          type: string
          example: Pérez
        lastname_m:
          type:
            - string
            - 'null'
        birth_date:
          type:
            - string
            - 'null'
          format: date
          example: '2000-05-10'
        phone:
          type:
            - string
            - 'null'
          example: '5512345678'

    ClientAddressInput:
      type: object
      description: Igual que `AddressInput`, pero en las direcciones del cliente las coordenadas son opcionales.
      required:
        - street
        - num_ext
        - colony
        - municipality
        - state
        - postal_code
      properties:
        alias:
          type: string
          maxLength: 100
          example: Casa
        reference:
          type: string
        street:
          type: string
          maxLength: 255
        num_ext:
          type: string
          maxLength: 50
        num_int:
          type: string
          maxLength: 50
        colony:
          type: string
          maxLength: 150
        municipality:
          type: string
          maxLength: 150
        state:
          type: string
          maxLength: 150
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          default: México
        latitude:
          type:
            - number
            - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
            - number
            - 'null'
          minimum: -180
          maximum: 180
        is_main:
          type: boolean
          default: false

    ClientAddress:
      type: object
      properties:
        id:
          type: string
          example: '31'
        alias:
          type:
            - string
            - 'null'
        is_main:
          type: boolean
        reference:
          type:
            - string
            - 'null'
        street:
          type: string
        num_ext:
          type: string
        num_int:
          type:
            - string
            - 'null'
        colony:
          type: string
        municipality:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        latitude:
          type:
            - number
            - 'null'
          example: 19.4326
        longitude:
          type:
            - number
            - 'null'
          example: -99.1332

    # ------------------------------------------------------------------------
    # Archivos
    # ------------------------------------------------------------------------

    FileCategory:
      type: string
      description: Define qué tipos y tamaños se aceptan. `documents` son documentos de verificación (solo los ve el administrador).
      enum:
        - documents
        - photos
        - evidences
      default: documents

    StoredFile:
      type: object
      required:
        - file_key
        - original_name
        - mime_type
        - size_bytes
        - file_hash
        - category
        - is_verification
        - uploaded_at
      properties:
        file_key:
          type: string
          description: Ruta del archivo; incluye el id de quien lo subió.
          example: photos/16/2026/11/0339630c-b10f-43ad-930b-3504ab442d6a-foto.png
        original_name:
          type: string
          example: foto.png
        mime_type:
          type: string
          example: image/png
        size_bytes:
          type: integer
          example: 284133
        file_hash:
          type: string
          description: SHA-256 del contenido.
        category:
          $ref: '#/components/schemas/FileCategory'
        is_verification:
          type: boolean
        uploaded_at:
          type: string
          format: date-time

    SignedUrl:
      type: object
      properties:
        file_key:
          type: string
        signed_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        expires_in_seconds:
          type: integer
          example: 1800

    UploadedFile:
      type: object
      required:
        - file_key
        - mime_type
        - size_bytes
      properties:
        file_key:
          type: string
          example: solicitud/2026/11/8f1c2e.jpg
        mime_type:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
            - application/pdf
        size_bytes:
          type: integer
          example: 284133
        url:
          type: string
          format: uri
          description: Enlace temporal para mostrar el archivo.

    # ------------------------------------------------------------------------
    # Proveedores
    # ------------------------------------------------------------------------

    SupplierType:
      type: string
      enum:
        - independiente
        - empresa

    SupplierApplicationState:
      type: string
      description: '`documentacion_incompleta` requiere migración: hoy el enum de la base solo tiene pendiente, aprobada y rechazada.'
      enum:
        - pendiente
        - aprobada
        - rechazada
        - documentacion_incompleta

    DocumentType:
      type: object
      properties:
        id:
          type: string
          example: '3'
        name:
          type: string
          example: Constancia de Situación Fiscal (RFC)
        description:
          type:
            - string
            - 'null'
        requires_expiration_date:
          type: boolean
        mandatory:
          type: boolean
        supplier_type:
          type: string
          enum:
            - independiente
            - empresa
            - ambos

    ScheduleInput:
      type: object
      required:
        - day_of_week
        - open_time
        - close_time
      properties:
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = domingo … 6 = sábado.
        open_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '09:00'
        close_time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '18:00'

    BranchCategoryInput:
      type: object
      required:
        - category_id
        - base_price
      properties:
        category_id:
          type: string
          example: '1'
        base_price:
          $ref: '#/components/schemas/Money'
        duration_minutes:
          type: integer
          minimum: 15
          default: 60

    BranchCategory:
      allOf:
        - $ref: '#/components/schemas/BranchCategoryInput'
        - type: object
          properties:
            category_name:
              type: string
              example: Plomería
            icon_key:
              type:
                - string
                - 'null'

    EmployeeInput:
      type: object
      required:
        - email
        - password
        - name
        - lastname_p
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Contraseña inicial; el empleado la cambia desde Mi cuenta.
        name:
          type: string
        lastname_p:
          type: string
        lastname_m:
          type: string
        phone:
          type: string
          pattern: '^\d{10}$'
        role:
          type: string
          enum:
            - gerente
            - empleado

    Employee:
      type: object
      properties:
        id:
          type: string
          example: '7'
        user_id:
          type: string
        branch_id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        lastname_p:
          type: string
        role:
          type: string
          enum:
            - gerente
            - empleado
        can_attend:
          type: boolean
          description: Si puede recibir solicitudes como técnico.
        active:
          type: boolean

    EmployeeDetail:
      allOf:
        - $ref: '#/components/schemas/Employee'
        - type: object
          properties:
            lastname_m:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            profile:
              type: object
              properties:
                photo_key:
                  type: string
                  nullable: true
                photo_url:
                  type: string
                  nullable: true
                  description: Enlace firmado a la foto, vigente 180 minutos.
                bio:
                  type: string
                  nullable: true
            vehicle:
              type: object
              nullable: true
              description: Vehículo activo del empleado; nulo si no tiene.
              properties:
                id:
                  type: string
                employee_id:
                  type: string
                plate:
                  type: string
                brand:
                  type: string
                model:
                  type: string
                color:
                  type: string
                active:
                  type: boolean

    BusinessInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: Plomería Hernández
        tax_identification:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\d{10}$'

    BranchInput:
      type: object
      required:
        - name
        - address
        - schedules
        - categories
      properties:
        name:
          type: string
          example: Sucursal Centro
        phone:
          type: string
          pattern: '^\d{10}$'
        email:
          type: string
          format: email
        description:
          type: string
        address:
          $ref: '#/components/schemas/AddressInput'
        schedules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ScheduleInput'
        categories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BranchCategoryInput'
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeInput'
        manager_is_owner:
          type: boolean
          default: true
          description: Si el encargado queda como gerente de esta sucursal.

    SupplierApplicationCreate:
      type: object
      required:
        - manager
        - supplier_type
        - business
        - branches
      properties:
        manager:
          $ref: '#/components/schemas/RegisterClientRequest'
        supplier_type:
          $ref: '#/components/schemas/SupplierType'
        rfc:
          type: string
          maxLength: 50
          example: HEGJ850101AB1
        business:
          $ref: '#/components/schemas/BusinessInput'
        branches:
          type: array
          minItems: 1
          description: Un independiente manda una sola sucursal.
          items:
            $ref: '#/components/schemas/BranchInput'

    DocumentValidation:
      type: object
      properties:
        result:
          type: string
          enum:
            - aprobado
            - rechazado
        comment:
          type:
            - string
            - 'null'
        reviewed_at:
          type: string
          format: date-time

    SupplierDocument:
      type: object
      properties:
        id:
          type: string
          example: '44'
        type_document_id:
          type: string
        type_name:
          type: string
          example: Comprobante de Domicilio
        file_key:
          type: string
        upload_date:
          type: string
          format: date
        due_date:
          type:
            - string
            - 'null'
          format: date
        is_public:
          type: boolean
        validation:
          description: Última revisión del administrador; `null` si aún no se revisa.
          oneOf:
            - $ref: '#/components/schemas/DocumentValidation'
            - type: 'null'

    SupplierApplicationSummary:
      type: object
      properties:
        id:
          type: string
          example: '9'
        state:
          $ref: '#/components/schemas/SupplierApplicationState'
        supplier_type:
          $ref: '#/components/schemas/SupplierType'
        application_date:
          type: string
          format: date
        business_name:
          type: string
        manager_name:
          type: string
        email:
          type: string
          format: email
        documents_pending:
          type: integer
          description: Documentos obligatorios faltantes o documentos que aún no están aprobados.

    SupplierApplication:
      allOf:
        - $ref: '#/components/schemas/SupplierApplicationSummary'
        - type: object
          properties:
            comments:
              type:
                - string
                - 'null'
              description: Comentario del administrador al resolver.
            rfc:
              type:
                - string
                - 'null'
            business:
              $ref: '#/components/schemas/BusinessInput'
            branches:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  address:
                    $ref: '#/components/schemas/Address'
                  schedules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleInput'
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/BranchCategory'
                  employees:
                    type: array
                    items:
                      $ref: '#/components/schemas/Employee'
            documents:
              type: array
              items:
                $ref: '#/components/schemas/SupplierDocument'

    DocumentReview:
      type: object
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - aprobado
            - rechazado
        comment:
          type: string
          maxLength: 1000
          description: Obligatorio al rechazar. Máximo 1000 caracteres.

    ApplicationResolution:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - aprobada
            - rechazada
            - documentacion_incompleta
        comments:
          type: string
          maxLength: 2000
          description: Obligatorio para `rechazada` y `documentacion_incompleta`. Máximo 2000 caracteres.

    StaffCreate:
      type: object
      required:
        - email
        - password
        - name
        - lastname_p
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        name:
          type: string
        lastname_p:
          type: string
        lastname_m:
          type: string
        role:
          type: string
          enum:
            - administrador
            - soporte

    # ------------------------------------------------------------------------
    # Sucursales, ficha y búsqueda
    # ------------------------------------------------------------------------

    PortfolioWorkInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
          example: Cambio de tubería de cobre
        description:
          type: string
        media:
          type: array
          description: Opcional. Fotos subidas por quien registra el trabajo (categoría `photos` o `evidences`).
          minItems: 0
          maxItems: 10
          items:
            type: object
            required:
              - file_key
            properties:
              file_key:
                type: string
              description:
                type: string

    PortfolioWork:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        media:
          type: array
          items:
            type: object
            properties:
              file_key:
                type: string
              url:
                type: string
                format: uri
              description:
                type:
                  - string
                  - 'null'

    BranchPublicProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        business_name:
          type: string
        supplier_type:
          $ref: '#/components/schemas/SupplierType'
        description:
          type:
            - string
            - 'null'
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        phone:
          type:
            - string
            - 'null'
        is_verified:
          type: boolean
          description: Si el proveedor cuenta con solicitud aprobada (insignia de verificado).
        plates:
          type: array
          items:
            type: string
          description: Placas de vehículos activos de los técnicos/empleados asignados a la sucursal.
        rating_avg:
          type: number
          example: 4.7
        reviews_count:
          type: integer
        total_jobs:
          type: integer
        accepting_request:
          type: boolean
        location:
          type: object
          description: Solo colonia, municipio y coordenadas; la dirección exacta no es pública.
          properties:
            colony:
              type: string
            municipality:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleInput'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BranchCategory'
        portfolio:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioWork'
        certificates:
          type: array
          description: Solo los documentos aprobados y marcados como públicos.
          items:
            type: object
            properties:
              type_name:
                type: string
              url:
                type: string
                format: uri
        latest_reviews:
          type: array
          maxItems: 5
          items:
            type: object
            properties:
              rating:
                type: integer
                minimum: 1
                maximum: 5
              comment:
                type:
                  - string
                  - 'null'
              author_name:
                type: string
                description: Nombre e inicial del apellido.
              created_at:
                type: string
                format: date-time
          description: Se conserva por compatibilidad; son las primeras 5 de `reviews.items`.
        reviews:
          $ref: '#/components/schemas/BranchReviewsPage'

    TechnicianAvailability:
      type: object
      properties:
        employee_id:
          type: string
        user_id:
          type: string
        branch_id:
          type: string
        online:
          type: boolean
        location:
          type:
            - object
            - 'null'
          properties:
            latitude:
              type: number
            longitude:
              type: number
        branch:
          type: object
          properties:
            id:
              type: string
            accepting_request:
              type: boolean
            is_open:
              type: boolean
            current_time:
              type: string
        expires_in_seconds:
          type: integer
          description: Segundos restantes antes de que la marca de disponibilidad expire por inactividad.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time

    BranchSearchResult:
      type: object
      properties:
        id:
          type: string
          example: '5'
        name:
          type: string
        business_name:
          type: string
        supplier_type:
          $ref: '#/components/schemas/SupplierType'
        logo_url:
          type:
            - string
            - 'null'
          format: uri
        latitude:
          type: number
        longitude:
          type: number
        distance_km:
          type: number
          example: 1.8
        rating_avg:
          type: number
          example: 4.6
        reviews_count:
          type: integer
        base_price:
          description: Precio base de la categoría buscada; `null` si no se filtró por categoría.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        open_now:
          type: boolean

    # ------------------------------------------------------------------------
    # Notificaciones
    # ------------------------------------------------------------------------

    DeviceTokenInput:
      type: object
      required:
        - token
        - platform
      properties:
        token:
          type: string
          maxLength: 500
        platform:
          type: string
          enum:
            - android
            - ios
            - web

    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          description: Evento que la originó.
          example: solicitud_aceptada
        title:
          type: string
          example: Tu solicitud fue aceptada
        message:
          type: string
        entity_type:
          type:
            - string
            - 'null'
          description: Qué pantalla abrir al tocarla.
          enum:
            - service_request
            - supplier_application
            - supplier_verification
            - supplier_document
            - report
            - null
        entity_id:
          type:
            - string
            - 'null'
        read_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
          description: Fecha en que se generó la notificación.

    # ------------------------------------------------------------------------
    # Solicitudes de servicio
    # ------------------------------------------------------------------------

    ServiceRequestStatus:
      type: string
      description: |
        `en_camino` y `llegado` se almacenan como estados independientes. Los registros históricos
        con `en_curso` se exponen como `en_camino` por compatibilidad.
      enum:
        - pendiente
        - aceptada
        - agendada
        - en_camino
        - llegado
        - completada
        - cancelada
        - expirada

    TimeSlot:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    ServiceRequestCreate:
      type: object
      required:
        - client_uuid
        - branch_id
        - category_id
        - description
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Lo genera la app; evita duplicados al reintentar.
        branch_id:
          type: string
        category_id:
          type: string
        description:
          type: string
          minLength: 1
          maxLength: 2000
        address_id:
          type: string
          description: Dirección guardada. Manda esta o `address`.
        address:
          $ref: '#/components/schemas/AddressInput'
        attachment_keys:
          type: array
          maxItems: 5
          description: '`file_key` de fotos subidas con `category` = `photos`.'
          items:
            type: string
        scheduled_at:
          type: string
          format: date-time
          description: Inicio de uno de los horarios libres. Sin este campo, la solicitud es inmediata.

    EmergencyRequestCreate:
      type: object
      required:
        - client_uuid
        - category_id
        - latitude
        - longitude
      properties:
        client_uuid:
          type: string
          format: uuid
        category_id:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        description:
          type: string
          maxLength: 500

    IncomeRecord:
      type: object
      description: Ingreso de un pago confirmado con la comisión de la plataforma (API-38).
      properties:
        id:
          type: string
        branch_id:
          type: string
        branch_name:
          type: string
        request_id:
          type: string
        payment_id:
          type: string
        gross_amount:
          $ref: '#/components/schemas/Money'
        commission_amount:
          $ref: '#/components/schemas/Money'
        net_amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          example: MXN
        status:
          type: string
          enum: [pendiente, liquidado]
        commission_status:
          type: string
          enum: [pendiente, pagada]
        commission_paid_at:
          type:
            - string
            - 'null'
          format: date-time
        settled_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    CommissionSetting:
      type: object
      properties:
        id:
          type: string
        percentage:
          type: string
          example: '10.00'
        effective_from:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    PaymentSummary:
      type: object
      description: Cuánto se ha pagado y cuánto falta (API-37).
      properties:
        total_amount:
          $ref: '#/components/schemas/Money'
        paid:
          $ref: '#/components/schemas/Money'
        pending_confirmation:
          $ref: '#/components/schemas/Money'
        balance_due:
          $ref: '#/components/schemas/Money'
        has_debt:
          type: boolean
          description: Finalizada y con saldo.
    Payment:
      type: object
      description: Pago que registra el cliente y el proveedor confirma (API-37).
      properties:
        id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          example: MXN
        method:
          type: string
          enum: [efectivo, transferencia, tarjeta]
        reference:
          type:
            - string
            - 'null'
        status:
          type: string
          enum: [pendiente, completado, fallido, reembolsado]
        registered_by:
          type:
            - string
            - 'null'
        confirmed_by:
          type:
            - string
            - 'null'
        rejection_reason:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time
        responded_at:
          type:
            - string
            - 'null'
          format: date-time
        paid_at:
          type:
            - string
            - 'null'
          format: date-time
    PriceAdjustment:
      type: object
      description: Monto extra que propone el técnico y el cliente aprueba o rechaza (API-36).
      properties:
        id:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          enum: [materiales_extra, tiempo_adicional, otro]
        description:
          type:
            - string
            - 'null'
        status:
          type: string
          enum: [pendiente, aprobado, rechazado, pagado]
        declared_by:
          type: string
        created_at:
          type: string
          format: date-time
        responded_at:
          type:
            - string
            - 'null'
          format: date-time
    ServiceRequest:
      type: object
      properties:
        id:
          type: string
          example: '120'
        status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        is_emergency:
          type: boolean
        description:
          type: string
        category:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        branch:
          type:
            - object
            - 'null'
          description: '`null` en una emergencia que nadie ha aceptado.'
          properties:
            id:
              type: string
            name:
              type: string
            phone:
              type:
                - string
                - 'null'
        technician:
          type:
            - object
            - 'null'
          description: >-
            [API-55] Desde que se acepta, el nombre, la foto y el vehículo son la copia guardada al
            aceptar, aunque el técnico edite después su perfil.
          properties:
            employee_id:
              type: string
            name:
              type: string
            photo_url:
              type:
                - string
                - 'null'
              format: uri
            vehicle:
              type:
                - object
                - 'null'
              properties:
                plate:
                  type: string
                brand:
                  type: string
                model:
                  type: string
                color:
                  type: string
            verified:
              type: boolean
              description: >-
                [API-56] El proveedor de la sucursal tiene su solicitud de alta aprobada; es la
                misma insignia que `is_verified` de la ficha pública.
        client:
          type: object
          description: Visible para el proveedor.
          properties:
            name:
              type: string
            rating_avg:
              type:
                - number
                - 'null'
            reviews_count:
              type: integer
              description: Reseñas publicadas que ha recibido el cliente de proveedores.
            reviews:
              type: array
              description: Últimos comentarios de proveedores sobre el cliente (hasta 5), visibles antes de aceptar.
              items:
                $ref: '#/components/schemas/ClientReview'
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: 'null'
          description: En emergencias, la ubicación actual se expone en `location`.
        location:
          type:
            - object
            - 'null'
          properties:
            latitude:
              type: number
            longitude:
              type: number
        base_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        agreed_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        total_amount:
          description: Precio acordado más ajustes aprobados; se fija al finalizar (API-36).
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        price_adjustments:
          type: array
          items:
            $ref: '#/components/schemas/PriceAdjustment'
        payment_summary:
          $ref: '#/components/schemas/PaymentSummary'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/UploadedFile'
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Fin de los 5 minutos para responder.
        scheduled_at:
          type:
            - string
            - 'null'
          format: date-time
        accepted_at:
          type:
            - string
            - 'null'
          format: date-time
        arrived_at:
          type:
            - string
            - 'null'
          format: date-time
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
        canceled_by:
          type:
            - string
            - 'null'
          enum:
            - cliente
            - proveedor
            - sistema
            - null
        canceled_reason:
          type:
            - string
            - 'null'
        dispatches:
          type: object
          description: >-
            A cuántos técnicos se les avisó y cuántos la rechazaron. Rechazar no cambia el estado
            (sigue pendiente hasta vencer); con esto el cliente se entera de inmediato.
          properties:
            sent:
              type: integer
            rejected:
              type: integer

    StatusChange:
      type: object
      required:
        - status
        - latitude
        - longitude
      properties:
        status:
          type: string
          enum:
            - en_camino
            - llegado
            - completada
        latitude:
          type: number
        longitude:
          type: number
        closing_keys:
          type: array
          description: Fotos del cierre (`category` = `evidences`), solo al pasar a `completada`.
          items:
            type: string

    CancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Obligatorio cuando la solicitud ya fue aceptada.
        evidence_keys:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            maxLength: 500
          description: Llaves de archivos subidos por el proveedor/técnico en la categoría evidences.

    ServiceRequestEvent:
      type: object
      properties:
        from_status:
          oneOf:
            - $ref: '#/components/schemas/ServiceRequestStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/ServiceRequestStatus'
        changed_by:
          type: object
          properties:
            id:
              type: string
            role:
              $ref: '#/components/schemas/UserRole'
        latitude:
          type:
            - number
            - 'null'
        longitude:
          type:
            - number
            - 'null'
        created_at:
          type: string
          format: date-time

    SendChatMessageInput:
      type: object
      required:
        - client_uuid
      description: Debe incluir `message`, `attachment_keys` o ambos.
      properties:
        client_uuid:
          type: string
          format: uuid
          description: Lo genera la app por mensaje; reintentar con el mismo valor no duplica.
        message:
          type: string
          maxLength: 2000
        reply_to_id:
          type: string
          description: Id de un mensaje de la misma conversación al que se responde.
        attachment_keys:
          type: array
          maxItems: 5
          items:
            type: string
          description: Llaves de fotografías subidas con `category=photos`.

    ChatAttachment:
      type: object
      properties:
        id:
          type: string
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size_bytes:
          type:
            - integer
            - 'null'
        url:
          type:
            - string
            - 'null'
          description: Enlace firmado con vigencia de 60 minutos.

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        request_id:
          type: string
        sender_id:
          type: string
        sender_name:
          type:
            - string
            - 'null'
        sender_side:
          type: string
          enum: [cliente, proveedor]
        message:
          type:
            - string
            - 'null'
        reply_to:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            sender_id:
              type: string
            message:
              type:
                - string
                - 'null'
            has_attachments:
              type: boolean
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        client_uuid:
          type:
            - string
            - 'null'
        read_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time

    ChatPagination:
      type: object
      properties:
        limit:
          type: integer
        has_more:
          type: boolean
        next_before:
          type:
            - string
            - 'null'
          description: Cursor para pedir mensajes más viejos (`before`).
        next_after:
          type:
            - string
            - 'null'
          description: Cursor para pedir mensajes más nuevos (`after`).

    ChatPage:
      type: object
      properties:
        conversation:
          type: object
          properties:
            id:
              type: string
            request_id:
              type: string
            status:
              type: string
              enum: [abierta, cerrada]
            can_send:
              type: boolean
            unread_count:
              type: integer
              description: Mensajes de la otra parte que aún no se marcan como leídos.
            created_at:
              type: string
              format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        pagination:
          $ref: '#/components/schemas/ChatPagination'

    ReportConversation:
      type: object
      properties:
        report_id:
          type: string
        request_id:
          type:
            - string
            - 'null'
        conversation:
          type:
            - object
            - 'null'
          properties:
            id:
              type: string
            status:
              type: string
              enum: [abierta, cerrada]
            read_only:
              type: boolean
              example: true
            created_at:
              type: string
              format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        pagination:
          $ref: '#/components/schemas/ChatPagination'

    CreateReviewInput:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        attachment_keys:
          type: array
          maxItems: 3
          items:
            type: string
          description: Llaves de imágenes (JPEG, PNG, WebP) o video MP4 subidos con `category=photos` o `evidences`.
        client_uuid:
          type: string
          format: uuid

    ReviewEvidence:
      type: object
      properties:
        id:
          type: string
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, video/mp4]
        size_bytes:
          type:
            - integer
            - 'null'
        url:
          type:
            - string
            - 'null'
          description: Enlace firmado con vigencia de 180 minutos.

    Review:
      type: object
      description: Reseña vista por quien participa en la solicitud.
      properties:
        id:
          type: string
        request_id:
          type: string
        direction:
          type: string
          enum: [cliente_a_proveedor, proveedor_a_cliente]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type:
            - string
            - 'null'
        author_id:
          type: string
        author_name:
          type: string
        reviewee_id:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/ReviewEvidence'
        client_uuid:
          type:
            - string
            - 'null'
        created_at:
          type: string
          format: date-time

    RequestReviews:
      type: object
      properties:
        request_id:
          type: string
        my_direction:
          type: string
          enum: [cliente_a_proveedor, proveedor_a_cliente]
        can_review:
          type: boolean
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'

    ClientReview:
      type: object
      properties:
        id:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type:
            - string
            - 'null'
        author_name:
          type: string
          description: Nombre e inicial del apellido del proveedor que calificó.
        created_at:
          type: string
          format: date-time

    BranchReviewsPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              rating:
                type: integer
                minimum: 1
                maximum: 5
              comment:
                type:
                  - string
                  - 'null'
              author_name:
                type: string
                description: Nombre e inicial del apellido.
              created_at:
                type: string
                format: date-time
              evidence:
                type: array
                items:
                  type: object
                  properties:
                    mime_type:
                      type: string
                    url:
                      type:
                        - string
                        - 'null'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

  responses:
    InvalidInput:
      description: Faltan datos obligatorios o tienen un formato inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_INPUT
            message: Debes proporcionar email y password como cadenas de texto no vacías.

    RefreshTokenRequired:
      description: No se proporcionó un token de renovación válido como texto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: REFRESH_TOKEN_REQUIRED
            message: Debes proporcionar el token de renovación.

    InternalServerError:
      description: Error inesperado del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INTERNAL_SERVER_ERROR
            message: Error interno del servidor.

    ValidationError:
      description: Los datos no cumplen el contrato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            error: VALIDATION_ERROR
            message: Los datos enviados no son válidos.
            details:
              - field: phone
                message: El teléfono debe tener 10 dígitos.

    Unauthorized:
      description: Falta el token, no es válido o la sesión terminó.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_ACCESS_TOKEN
            message: El token no es válido o ha expirado.

    Forbidden:
      description: La cuenta no tiene permiso para esta acción.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INSUFFICIENT_PERMISSIONS
            message: No tienes permisos para realizar esta acción.

    NotFound:
      description: El recurso no existe o no pertenece al usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: Recurso no encontrado.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
