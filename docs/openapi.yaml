      summary: '[Planeado · API-26] Listar mis solicitudes'
      description: |
        El cliente ve las suyas; el proveedor y el gerente, las de sus sucursales; el empleado, las
        que tiene asignadas o le llegaron.
      x-estado: planeado
      x-ticket: API-26
