  # ==========================================================================
  # Planeados · Módulo 6: solicitudes de servicio
  # ==========================================================================

  /api/branches/{id}/availability:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Solicitudes de servicio
      summary: 'Horarios libres para agendar'
      description: Según el horario de la sucursal, los bloqueos de sus técnicos y la duración de la categoría.
      x-estado: implementado
      x-ticket: API-27
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category_id
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Horarios disponibles ese día.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TimeSlot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/service-requests:
    get:
      tags:
        - Solicitudes de servicio
      summary: 'Listar mis solicitudes'
      description: |
        El cliente ve las suyas; el proveedor y el gerente, las de sus sucursales; el empleado, las
        que tiene asignadas o le llegaron.
      x-estado: implementado
      x-ticket: API-26
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ServiceRequestStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Solicitudes, las más recientes primero.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceRequest'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Crear una solicitud normal o agendada'
      description: |
        Sin `scheduled_at` queda `pendiente` y corre el temporizador de 5 minutos (`expires_at`).
        Con `scheduled_at` también espera la respuesta del proveedor; al aceptarla pasa a `agendada`.
        `client_uuid` evita duplicados si la app reintenta: con el mismo valor se regresa la misma solicitud.
      x-estado: implementado
      x-ticket: API-27
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequestCreate'
      responses:
        '201':
          description: Solicitud enviada al proveedor.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La sucursal no acepta solicitudes ahora o el horario ya no está libre (`BRANCH_NOT_AVAILABLE`, `SLOT_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/emergency:
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Botón de emergencia (API-28)'
      description: |
        Solo pide la categoría y la ubicación actual. Se avisa a la vez a los técnicos cercanos
        disponibles de sucursales que atienden esa categoría y están dentro de 10 km. Se priorizan
        proveedores independientes y después calificación y distancia. Cada técnico notificado
        queda registrado en `request_dispatches`. La asignación ocurre cuando un técnico acepta
        mediante API-30; los demás despachos se retiran en esa aceptación.
      x-estado: implementado
      x-ticket: API-28
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyRequestCreate'
      responses:
        '201':
          description: Emergencia enviada a los técnicos cercanos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: No hay técnicos disponibles cerca (`NO_TECHNICIANS_AVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: NO_TECHNICIANS_AVAILABLE
                message: No hay técnicos disponibles cerca para esta categoría.

  /api/service-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Solicitudes de servicio
      summary: 'Ver una solicitud'
      x-estado: implementado
      x-ticket: API-26
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalle de la solicitud.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/service-requests/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Aceptar una solicitud (proveedor)'
      description: Asigna el técnico, fija el precio acordado y la fecha de aceptación, detiene el temporizador y emite el evento «solicitud aceptada».
      x-estado: implementado
      x-ticket: API-30
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  type: string
                  description: Identificador del técnico que atenderá.
              required:
                - employee_id
      responses:
        '200':
          description: Solicitud aceptada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ya expiró, la canceló el cliente o la aceptó otro técnico (`REQUEST_NOT_PENDING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Rechazar una solicitud (proveedor)'
      description: Registra el rechazo en el despacho. En emergencias solo retira la solicitud para el técnico; en solicitudes normales notifica al cliente para que elija otro proveedor.
      x-estado: implementado
      x-ticket: API-30
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
              required:
                - reason
      responses:
        '200':
          description: Solicitud rechazada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La solicitud ya no está pendiente (`REQUEST_NOT_PENDING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Avanzar el estado (técnico)'
      description: |
        Transiciones permitidas: `aceptada`/`agendada` → `en_camino` → `llegado` → `completada`.
        Guarda la ubicación del técnico como punto clave en el historial. Emite el evento del
        cambio de estado.

        Al pasar a `completada` fija `total_amount` = `agreed_price` + ajustes de precio aprobados
        (API-36). No se puede finalizar mientras un ajuste espera la respuesta del cliente.
      x-estado: implementado
      x-ticket: API-26
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusChange'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La transición no está permitida desde el estado actual (`INVALID_STATUS_TRANSITION`),
            o se intenta finalizar con un ajuste de precio sin responder (`PRICE_ADJUSTMENT_PENDING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Solicitudes de servicio
      summary: Cancelar una solicitud
      description: |
        El cliente puede cancelar una solicitud pendiente sin motivo. Después de la aceptación,
        tanto el cliente como el proveedor deben indicar un motivo. El proveedor o técnico asignado
        puede adjuntar hasta cinco evidencias previamente subidas mediante POST /api/files/upload
        con category=evidences. Si el proveedor cancela sin evidencia, la cancelación queda
        registrada como injustificada para el cálculo de reputación; la sanción formal se gestiona
        posteriormente en el work item de sanciones del Sprint 6.
      x-estado: implementado
      x-ticket: API-31
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            examples:
              cancelacionPendienteCliente:
                summary: Cliente cancela antes de aceptación
                value: {}
              cancelacionDespuesDeAceptar:
                summary: Cliente o proveedor cancela después de aceptación
                value:
                  reason: El servicio ya no será necesario.
              cancelacionProveedorConEvidencia:
                summary: Proveedor adjunta evidencia
                value:
                  reason: El domicilio no permite realizar el trabajo de forma segura.
                  evidence_keys:
                    - evidences/42/2026/11/evidencia-cancelacion.jpg
      responses:
        '200':
          description: Solicitud cancelada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ServiceRequest'
        '400':
          description: Motivo faltante o datos/evidencias inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La transición no está permitida desde el estado actual (`INVALID_STATUS_TRANSITION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/price-adjustments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Solicitudes de servicio
      summary: 'Ajustes de precio de una solicitud'
      description: |
        Lista los ajustes que propuso el técnico y el total que llevan. La ve quien puede ver la
        solicitud: el cliente, el técnico asignado y el proveedor o gerente de la sucursal.

        Precio de emergencia: no lleva recargo. Se cobra el precio base de la sucursal que la acepta
        (`agreed_price`) y lo extra solo entra como un ajuste que el cliente aprueba.
      x-estado: implementado
      x-ticket: API-36
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ajustes y total.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          agreed_price:
                            oneOf:
                              - $ref: '#/components/schemas/Money'
                              - type: 'null'
                          approved_total:
                            $ref: '#/components/schemas/Money'
                          total_amount:
                            $ref: '#/components/schemas/Money'
                          adjustments:
                            type: array
                            items:
                              $ref: '#/components/schemas/PriceAdjustment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Proponer un ajuste de precio (técnico)'
      description: |
        El técnico asignado propone cobrar un monto extra cuando ya llegó al domicilio (`llegado`).
        Queda `pendiente` hasta que el cliente lo aprueba o rechaza; solo puede haber uno pendiente.
        Con el mismo `client_uuid` un reintento regresa el ajuste ya creado (200) en vez de
        duplicarlo. Avisa al cliente por push, centro de notificaciones y tiempo real
        (`price_adjustment_updated`).
      x-estado: implementado
      x-ticket: API-36
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount:
                  description: Monto extra, mayor a 0 y hasta 50000.00, con máximo 2 decimales.
                  oneOf:
                    - type: number
                    - type: string
                reason:
                  type: string
                  enum: [materiales_extra, tiempo_adicional, otro]
                description:
                  type: string
                  maxLength: 500
                  description: Obligatoria cuando `reason` es `otro`.
                client_uuid:
                  type: string
                  maxLength: 100
              required:
                - amount
                - reason
      responses:
        '201':
          description: Ajuste creado y pendiente de respuesta.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PriceAdjustment'
        '200':
          description: Reintento con el mismo `client_uuid`; regresa el ajuste existente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PriceAdjustment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La solicitud no está en `llegado` (`INVALID_REQUEST_STATUS`) o ya hay un ajuste
            esperando respuesta (`PRICE_ADJUSTMENT_PENDING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/price-adjustments/{adjustmentId}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: adjustmentId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,17}$'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Aprobar un ajuste de precio (cliente)'
      description: |
        Solo el cliente de la solicitud, mientras está en `llegado`. El monto se suma al total que
        se fija al finalizar. Avisa al técnico.
      x-estado: implementado
      x-ticket: API-36
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ajuste aprobado, con el total actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          adjustment:
                            $ref: '#/components/schemas/PriceAdjustment'
                          total_amount:
                            $ref: '#/components/schemas/Money'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            El ajuste ya fue respondido (`PRICE_ADJUSTMENT_ALREADY_RESPONDED`) o la solicitud ya no
            admite cambios de precio (`INVALID_REQUEST_STATUS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/price-adjustments/{adjustmentId}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: adjustmentId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,17}$'
    post:
      tags:
        - Solicitudes de servicio
      summary: 'Rechazar un ajuste de precio (cliente)'
      description: Igual que aprobar, pero el monto no se suma. Avisa al técnico.
      x-estado: implementado
      x-ticket: API-36
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ajuste rechazado, con el total sin ese monto.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          adjustment:
                            $ref: '#/components/schemas/PriceAdjustment'
                          total_amount:
                            $ref: '#/components/schemas/Money'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El ajuste ya fue respondido o la solicitud ya no admite cambios de precio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Pagos
      summary: 'Pagos de una solicitud'
      description: |
        Pagos registrados y lo que falta. Lo ve quien puede ver la solicitud. El saldo es el total
        (`total_amount`) menos lo confirmado por el proveedor; si la solicitud está finalizada y queda
        saldo, es un adeudo (`has_debt`).
      x-estado: implementado
      x-ticket: API-37
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen y pagos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            $ref: '#/components/schemas/PaymentSummary'
                          payments:
                            type: array
                            items:
                              $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Pagos
      summary: 'Registrar un pago (cliente)'
      description: |
        El cliente registra que pagó en efectivo o por transferencia un servicio ya `completada`.
        Queda `pendiente` hasta que el proveedor confirma que lo recibió; solo puede haber uno
        pendiente. Sin `amount` paga todo lo que falta; puede pagar en partes. Con el mismo
        `client_uuid` un reintento regresa el pago ya creado (200). La tarjeta todavía no está
        disponible (`PAYMENT_METHOD_UNAVAILABLE`). Avisa al técnico.
      x-estado: implementado
      x-ticket: API-37
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [efectivo, transferencia]
                amount:
                  description: Opcional; mayor a 0 y hasta lo que falta, con máximo 2 decimales.
                  oneOf:
                    - type: number
                    - type: string
                reference:
                  type: string
                  maxLength: 255
                  description: Folio o referencia de la transferencia.
                client_uuid:
                  type: string
                  maxLength: 100
              required:
                - method
      responses:
        '201':
          description: Pago registrado, esperando confirmación.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Payment'
        '200':
          description: Reintento con el mismo `client_uuid`; regresa el pago existente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Payment'
        '400':
          description: |
            Datos inválidos (`VALIDATION_ERROR`), tarjeta (`PAYMENT_METHOD_UNAVAILABLE`) o monto mayor
            a lo que falta (`AMOUNT_EXCEEDS_BALANCE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La solicitud no está finalizada (`INVALID_REQUEST_STATUS`), ya hay un pago esperando
            confirmación (`PAYMENT_PENDING`) o ya está pagada (`NOTHING_TO_PAY`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/payments/{paymentId}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          pattern: '^[1-9][0-9]{0,17}$'
    post:
      tags:
        - Pagos
      summary: 'Confirmar que se recibió el pago (proveedor)'
      description: |
        El técnico asignado, el dueño o el gerente de la sucursal confirma el cobro. Al quedar pagado
        todo, los ajustes de precio aprobados pasan a `pagado`. Registra el ingreso con la comisión
        de la plataforma (API-38). Avisa al cliente.
      x-estado: implementado
      x-ticket: API-37
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pago confirmado, con el saldo actualizado.
          content:
            application/json:
              schema:
                allOf:
