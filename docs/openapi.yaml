openapi: 3.1.0

info:
  title: Fixora API
  version: 1.0.0
  description: |
    Contrato de la API de Fixora, compartido por Android y Angular.

    ## Convenciones

    **Autenticación.** Los endpoints protegidos piden `Authorization: Bearer <accessToken>`.
    El token se obtiene en `POST /api/auth/login` y se renueva con `POST /api/auth/refresh`.

    **Identificadores.** Todos los ids son BIGINT y viajan como texto (`"15"`), porque JavaScript
    no representa con exactitud enteros de 64 bits.

    **Fechas.** `date` en formato `YYYY-MM-DD`; fecha y hora en ISO 8601 con zona (`2026-11-03T18:30:00Z`).
    Montos de dinero como texto decimal (`"350.00"`).

    **Respuestas correctas.** `{ success: true, message, data }`. Las listas agregan `pagination`.

    **Paginación.** Las listas aceptan `?page=1&limit=20` (`limit` máximo 100) y responden
    `pagination: { page, limit, total, total_pages }`.

    **Errores.** Siempre `{ error: "CODIGO", message: "Texto legible" }`. El código es estable y
    sirve para decidir qué hacer en la app; el mensaje se puede mostrar al usuario. Los errores de
    validación agregan `details` con el campo y el motivo.

    | HTTP | Cuándo |
    |---|---|
    | 400 | Datos inválidos, JSON mal formado (`INVALID_JSON`) |
    | 401 | Falta el token o ya no es válido |
    | 403 | La cuenta no tiene permiso o no está activa |
    | 404 | El recurso o la ruta no existe (`ROUTE_NOT_FOUND`) |
    | 409 | Conflicto con el estado actual (duplicado, ya procesado) |
    | 429 | Demasiados intentos |
    | 500 | Error inesperado (`INTERNAL_SERVER_ERROR`) |

    **Endpoints planeados.** Los que dicen **[Planeado · API-XX]** todavía no existen: son el
    contrato que implementará ese ticket, para que las apps puedan avanzar en paralelo. Llevan
    también `x-estado: planeado` y `x-ticket`.

servers:
  - url: http://localhost:3001
    description: Servidor local de desarrollo

tags:
  - name: Sistema
    description: Estado del servicio.
  - name: Registro
    description: Registro de clientes y verificación de correo electrónico.
  - name: Autenticación
    description: Inicio de sesión, sesiones y recuperación de contraseña.
  - name: Mi cuenta
    description: Datos personales, direcciones, dispositivos y notificaciones del usuario que inició sesión.
  - name: Archivos
    description: Subida de archivos (documentos, fotos y evidencias).
  - name: Proveedores
    description: Registro de proveedores y seguimiento de su solicitud.
  - name: Sucursales
    description: Empleados, categorías, portafolio y ficha pública de cada sucursal.
  - name: Búsqueda
    description: Búsqueda de proveedores cercanos para el mapa.
  - name: Solicitudes de servicio
    description: Creación, seguimiento y cambios de estado de una solicitud.
  - name: Administración
    description: Revisión de proveedores y alta de personal interno.
  - name: Usuarios
    description: Consulta de cuentas (solo administrador).
  - name: Categorías
    description: Administración y consulta del catálogo de categorías.
  - name: Desarrollo
    description: Endpoints disponibles únicamente fuera de producción.

paths:
  /api/auth/register:
    post:
      tags:
        - Registro
      summary: Registrar cliente
      description: |
        Crea una cuenta con el rol cliente y estado inicial por_verificar.
        Guarda la contraseña mediante hash y los datos personales del cliente.
        Después de crear la cuenta envía un código de verificación de seis dígitos
        al correo proporcionado. No genera tokens durante el registro.
      operationId: registerClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
            example:
              email: cliente@ejemplo.com
              password: Cliente123*
              name: Juan
              lastname_p: Perez
              lastname_m: Lopez
              birth_date: '2000-05-15'
              phone: '8711234567'
      responses:
        '201':
          description: Cliente registrado y correo de verificación enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterClientResponse'
              example:
                message: Registro completado. Revisa tu correo electrónico para verificar tu cuenta.
                user:
                  id: '42'
                  email: cliente@ejemplo.com
                  role: cliente
                  status: por_verificar
                verification:
                  required: true
                  expiresInMinutes: 10
        '400':
          description: Datos de registro inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: INVALID_INPUT
                    message: Debes proporcionar correo, contraseña, nombre y apellido paterno.
                invalidEmail:
                  value:
                    error: INVALID_EMAIL
                    message: El correo electrónico no tiene un formato válido.
                invalidPassword:
                  value:
                    error: INVALID_PASSWORD
                    message: La contraseña debe tener al menos 8 caracteres y no superar los 72 bytes.
                invalidName:
                  value:
                    error: INVALID_NAME
                    message: El nombre es obligatorio y no puede superar los 100 caracteres.
                invalidLastname:
                  value:
                    error: INVALID_LASTNAME
                    message: El apellido paterno es obligatorio y no puede superar los 100 caracteres.
                invalidPhone:
                  value:
                    error: INVALID_PHONE
                    message: El teléfono no puede superar los 30 caracteres.
                invalidBirthDate:
                  value:
                    error: INVALID_BIRTH_DATE
                    message: La fecha de nacimiento debe tener el formato YYYY-MM-DD y ser válida.
        '409':
          description: El correo ya está registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_REGISTERED
                message: Ya existe una cuenta registrada con este correo electrónico.
        '500':
          description: Error interno o rol cliente no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                roleNotFound:
                  value:
                    error: CLIENT_ROLE_NOT_FOUND
                    message: No se encuentra disponible el rol cliente.
                internalError:
                  value:
                    error: INTERNAL_SERVER_ERROR
                    message: Error interno del servidor.
        '503':
          description: La cuenta se creó, pero no fue posible enviar el correo de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_SEND_FAILED
                message: La cuenta fue creada, pero no fue posible enviar el código. Puedes solicitar otro envío.

  /api/auth/verify-email:
    post:
      tags:
        - Registro
      summary: Verificar correo electrónico
      description: |
        Comprueba el código de seis dígitos enviado al correo del cliente.
        El código vence según la configuración del servidor y permite un máximo
        de intentos configurado. Cuando la verificación es correcta, el código
        se consume y el estado de la cuenta cambia de por_verificar a activo.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              email: cliente@ejemplo.com
              code: '123456'
      responses:
        '200':
          description: Correo electrónico verificado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
              example:
                message: Correo electrónico verificado correctamente.
                status: activo
        '400':
          description: Código o datos de verificación inválidos, inexistentes o expirados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: INVALID_INPUT
                    message: Debes proporcionar el correo y el código de verificación.
                invalidCodeFormat:
                  value:
                    error: INVALID_CODE_FORMAT
                    message: El código debe contener exactamente seis dígitos.
                invalidVerification:
                  value:
                    error: INVALID_VERIFICATION
                    message: No existe una cuenta pendiente de verificación para esos datos.
                codeNotFound:
                  value:
                    error: VERIFICATION_CODE_NOT_FOUND
                    message: No existe un código pendiente. Solicita uno nuevo.
                codeExpired:
                  value:
                    error: VERIFICATION_CODE_EXPIRED
                    message: El código ha expirado. Solicita uno nuevo.
                invalidCode:
                  value:
                    error: INVALID_VERIFICATION_CODE
                    message: 'El código es incorrecto. Intentos restantes: 4.'
        '409':
          description: El correo ya fue verificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_VERIFIED
                message: El correo electrónico ya fue verificado.
        '429':
          description: Se alcanzó el máximo de intentos de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: VERIFICATION_ATTEMPTS_EXCEEDED
                message: Se alcanzó el máximo de intentos. Solicita un código nuevo.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/resend-verification:
    post:
      tags:
        - Registro
      summary: Reenviar código de verificación
      description: |
        Solicita un nuevo código para una cuenta pendiente de verificación.
        El código pendiente anterior se invalida. El servicio aplica un intervalo
        mínimo entre reenvíos. Para evitar revelar qué correos están registrados,
        las cuentas inexistentes o ya verificadas reciben una respuesta genérica.
      operationId: resendVerificationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: cliente@ejemplo.com
      responses:
        '200':
          description: Solicitud procesada; si la cuenta está pendiente, se envió un nuevo código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationResponse'
              examples:
                sent:
                  value:
                    message: Se ha enviado un nuevo código de verificación.
                    verification:
                      expiresInMinutes: 10
                      resendAvailableInSeconds: 60
                generic:
                  value:
                    message: Si existe una cuenta pendiente de verificación, recibirás un correo con las instrucciones.
        '400':
          description: Correo electrónico inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_EMAIL
                message: Debes proporcionar un correo electrónico válido.
        '429':
          description: Todavía no ha transcurrido el intervalo mínimo para reenviar el código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: RESEND_COOLDOWN
                message: Espera 35 segundos antes de solicitar otro código.
        '503':
          description: No fue posible enviar el correo de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_SEND_FAILED
                message: No fue posible enviar el correo de verificación. Intenta nuevamente.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: |
        Autentica al usuario mediante correo y contraseña.
        La cuenta debe estar activa y su rol habilitado.
        Devuelve un token de acceso y un token de renovación.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: cliente@fixora.com
              password: MiContrasena123
      responses:
        '200':
          description: Inicio de sesión exitoso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: Correo o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: INVALID_CREDENTIALS
                message: Correo o contraseña incorrectos.
        '403':
          description: Cuenta no habilitada o rol desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                accountNotActive:
                  summary: Cuenta inactiva
                  value:
                    error: ACCOUNT_NOT_ACTIVE
                    message: La cuenta no está habilitada para iniciar sesión.
                roleInactive:
                  summary: Rol desactivado
                  value:
                    error: ROLE_INACTIVE
                    message: El rol de esta cuenta está desactivado.
        '423':
          description: Cuenta bloqueada temporalmente por intentos fallidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: ACCOUNT_TEMPORARILY_LOCKED
                message: La cuenta está bloqueada temporalmente. Intenta más tarde.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renovar sesión
      description: |
        Genera un nuevo par de tokens y rota el token de renovación.
        El token de renovación anterior deja de ser válido después
        de una renovación exitosa.
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Sesión renovada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          $ref: '#/components/responses/RefreshTokenRequired'
        '401':
          description: Token inválido, sesión expirada o token ya utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  value:
                    error: INVALID_REFRESH_TOKEN
                    message: El token de renovación no es válido o ha expirado.
                invalidSession:
                  value:
                    error: INVALID_SESSION
                    message: La sesión no es válida o ha expirado.
        '403':
          description: Cuenta no habilitada o rol desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: |
        Revoca la sesión asociada al token de renovación proporcionado.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Sesión cerrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                message: Sesión cerrada correctamente.
        '400':
          $ref: '#/components/responses/RefreshTokenRequired'
        '401':
          description: Token de renovación inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidToken:
                  value:
                    error: INVALID_REFRESH_TOKEN
                    message: El token de renovación no es válido o ha expirado.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/dev/users:
    post:
      tags:
        - Desarrollo
      summary: Crear usuario de prueba
      description: |
        Crea un usuario para probar la autenticación.
        Este endpoint solo está disponible cuando NODE_ENV
        no tiene el valor production.
      operationId: createTestUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTestUserRequest'
            example:
              email: cliente.prueba@fixora.test
              password: Fixora123!
              role: cliente
              status: activo
      responses:
        '201':
          description: Usuario de prueba creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTestUserResponse'
        '400':
          description: Datos, rol o estado inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    error: INVALID_INPUT
                    message: Debes proporcionar email y password como cadenas de texto no vacías.
                invalidRole:
                  value:
                    error: INVALID_ROLE
                    message: El rol especificado no es válido.
                    availableRoles:
                      - administrador
                      - soporte
                      - cliente
                      - proveedor
                      - gerente
                      - empleado
                invalidStatus:
                  value:
                    error: INVALID_STATUS
                    message: El estado especificado no es válido.
                    availableStatuses:
                      - activo
                      - por_verificar
                      - por_aprobar
        '403':
          description: Creación de usuarios de prueba deshabilitada o rol no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                disabled:
                  value:
                    error: TEST_USERS_DISABLED
                    message: La creación de usuarios de prueba está deshabilitada.
                roleNotFound:
                  value:
                    error: ROLE_NOT_FOUND
                    message: El rol solicitado no existe o está desactivado.
        '409':
          description: Ya existe un usuario con ese correo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_EXISTS
                message: El correo ya está registrado.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/categories:
    get:
      tags:
        - Categorías
      summary: Consultar categorías activas
      description: Consulta pública del catálogo de categorías.
      security: []
      responses:
        '200':
          description: Categorías obtenidas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        '500':
          description: Error interno del servidor.

    post:
      tags:
        - Categorías
      summary: Crear una categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
            example:
              name: Plomería
              slug: plomeria
              icon_key: icons/plomeria.svg
              sort_order: 1
              active: true
      responses:
        '201':
          description: Categoría creada correctamente.
        '400':
          description: Datos inválidos.
        '401':
          description: No autenticado.
        '403':
          description: No tienes permisos de Administrador.
        '409':
          description: El slug ya existe.

  /api/categories/admin/all:
    get:
      tags:
        - Categorías
      summary: Consultar todas las categorías
      description: Consulta administrativa de categorías activas e inactivas.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Filtrar por nombre de categoría.
      responses:
        '200':
          description: Listado obtenido correctamente.
        '401':
          description: No autenticado.
        '403':
          description: Acceso denegado.

  /api/categories/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Identificador BIGINT de la categoría.

    get:
      tags:
        - Categorías
      summary: Consultar una categoría activa
      security: []
      responses:
        '200':
          description: Categoría obtenida correctamente.
        '400':
          description: Identificador inválido.
        '404':
          description: Categoría no encontrada.

    patch:
      tags:
        - Categorías
      summary: Actualizar una categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
            example:
              name: Plomería residencial
              icon_key: icons/plomeria.svg
              sort_order: 5
              active: true
      responses:
        '200':
          description: Categoría actualizada correctamente.
        '400':
          description: Datos inválidos.
        '401':
          description: No autenticado.
        '403':
          description: Acceso denegado.
        '404':
          description: Categoría no encontrada.
        '409':
          description: Slug duplicado.

    delete:
      tags:
        - Categorías
      summary: Desactivar una categoría
      description: Desactivación lógica; el registro no se elimina físicamente.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categoría desactivada correctamente.
        '401':
          description: No autenticado.
        '403':
          description: Acceso denegado.
        '404':
          description: Categoría no encontrada.
        '409':
          description: La categoría ya está desactivada.

  # ==========================================================================
  # Implementados (sin documentar hasta ahora)
  # ==========================================================================

  /api/health:
    get:
      tags:
        - Sistema
      summary: Estado del servicio
      description: Indica si la API responde y si puede hablar con PostgreSQL y Redis.
      security: []
      responses:
        '200':
          description: La API está en línea. Revisa `database` y `redis` para saber si sus servicios responden.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/HealthStatus'

  /api/users:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuarios registrados.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Usuarios
      summary: Consultar un usuario
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Usuario encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AdminUser'
        '400':
          description: El id no es un número (`USER_INVALID_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No existe el usuario (`USER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Recuperación de contraseña (API-9)
  # ==========================================================================

  /api/auth/forgot-password:
    post:
      tags:
        - Autenticación
      summary: Pedir código para restablecer la contraseña
      description: |
        Envía al correo un código de 6 dígitos que vence en 10 minutos. Responde lo mismo exista o
        no la cuenta, para no revelar qué correos están registrados. Si se vuelve a pedir antes de
        1 minuto, responde igual pero no manda otro correo.

        El código se guarda en Redis (con su hash, nunca en claro); si Redis no está disponible
        responde 503.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Si la cuenta existe, se envió el código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                message: Si el correo está registrado, recibirás instrucciones para recuperar tu contraseña.
        '400':
          description: Falta el correo (`INVALID_INPUT`) o no es válido (`INVALID_EMAIL`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Redis no está disponible (`RECOVERY_SERVICE_UNAVAILABLE`), el correo no está configurado
            (`RECOVERY_EMAIL_NOT_CONFIGURED`) o no se pudo enviar (`RECOVERY_EMAIL_FAILED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/reset-password:
    post:
      tags:
        - Autenticación
      summary: Restablecer la contraseña con el código
      description: |
        Cambia la contraseña y cierra todas las sesiones abiertas de la cuenta. El código se usa una
        sola vez; al 5.º intento fallido se invalida y hay que pedir otro.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '400':
          description: |
            Faltan datos (`INVALID_INPUT`), el código no es de 6 dígitos o es incorrecto
            (`INVALID_RECOVERY_CODE`), ya venció o se usó (`RECOVERY_CODE_EXPIRED`), la contraseña
            no cumple las reglas (`INVALID_PASSWORD`) o es igual a la anterior (`PASSWORD_REUSED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Hay otro restablecimiento en curso para ese correo (`RECOVERY_IN_PROGRESS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Se superó el límite de intentos (`RECOVERY_ATTEMPTS_EXCEEDED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Redis no está disponible (`RECOVERY_SERVICE_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Mi cuenta (API-10)
  # ==========================================================================

  /api/me:
    get:
      tags:
        - Mi cuenta
      summary: Consultar mi cuenta
      description: Datos de la cuenta y datos personales del usuario que inició sesión.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cuenta del usuario.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MyAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La cuenta ya no existe (`ACCOUNT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Mi cuenta
      summary: Editar mis datos personales
      description: Solo cambia los campos que se mandan. El correo no se cambia por aquí.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              name: Ana
              lastname_p: Pérez
              phone: '5512345678'
      responses:
        '200':
          description: Datos actualizados.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PersonalData'
        '400':
          description: |
            Sin campos (`ACCOUNT_INVALID_INPUT`), teléfono que no tiene 10 dígitos
            (`ACCOUNT_INVALID_PHONE`) u otro dato inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/password:
    patch:
      tags:
        - Mi cuenta
      summary: Cambiar mi contraseña
      description: Valida la contraseña actual y cierra las demás sesiones; la actual sigue abierta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '200':
          description: Contraseña actualizada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          password_changed:
                            type: boolean
                            example: true
                          other_sessions_revoked:
                            type: boolean
                            example: true
        '400':
          description: |
            La actual es incorrecta (`ACCOUNT_INCORRECT_CURRENT_PASSWORD`), la nueva es igual a la
            actual (`ACCOUNT_SAME_PASSWORD`) o no cumple las reglas (`ACCOUNT_INVALID_NEW_PASSWORD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/addresses:
    get:
      tags:
        - Mi cuenta
      summary: Listar mis direcciones
      description: Solo las activas; la principal va primero.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Direcciones guardadas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ClientAddress'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Mi cuenta
      summary: Guardar una dirección
      description: Si es la primera o llega con `is_main` en `true`, queda como principal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientAddressInput'
      responses:
        '201':
          description: Dirección guardada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientAddress'
        '400':
          description: Falta un campo obligatorio (`ACCOUNT_INVALID_INPUT`) o la coordenada está fuera de rango (`ACCOUNT_INVALID_COORDINATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/addresses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Mi cuenta
      summary: Ver una dirección
      security:
        - bearerAuth: []
      responses:
        '200':
          description: La dirección.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientAddress'
        '400':
          description: Id inválido (`ACCOUNT_INVALID_ADDRESS_ID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe o no es tuya (`ACCOUNT_ADDRESS_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Mi cuenta
      summary: Editar una dirección
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
      responses:
        '200':
          description: Dirección actualizada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientAddress'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe o no es tuya (`ACCOUNT_ADDRESS_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Mi cuenta
      summary: Borrar una dirección
      description: Baja lógica. Si era la principal, la siguiente pasa a ser principal.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dirección borrada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          address_id:
                            type: string
                          active:
                            type: boolean
                            example: false
                          was_main:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe o no es tuya (`ACCOUNT_ADDRESS_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me/addresses/{id}/main:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags:
        - Mi cuenta
      summary: Marcar una dirección como principal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: La dirección ahora es la principal.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          address_id:
                            type: string
                          is_main:
                            type: boolean
                            example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe o no es tuya (`ACCOUNT_ADDRESS_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Archivos (API-8)
  # ==========================================================================

  /api/files/upload:
    post:
      tags:
        - Archivos
      summary: Subir un archivo
      description: |
        Guarda el archivo y regresa su `file_key`, que es lo que se manda después en los demás
        endpoints (fotos de una solicitud, evidencias, portafolio). La llave lleva el id de quien
        lo subió; solo esa persona o el administrador lo pueden borrar.

        | `category` | Tipos | Máximo |
        |---|---|---|
        | `documents` | PDF, JPG, PNG, WEBP | 10 MB |
        | `photos` | JPG, PNG, WEBP | 5 MB |
        | `evidences` | JPG, PNG, WEBP, PDF, MP4 | 25 MB |

        Los `documents` son documentos de verificación: solo el administrador puede verlos o borrarlos.
        Además del tipo declarado, se revisa que el contenido del archivo corresponda a ese tipo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                category:
                  $ref: '#/components/schemas/FileCategory'
      responses:
        '201':
          description: Archivo guardado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StoredFile'
        '400':
          description: |
            Falta el archivo, la categoría no es válida, el tipo o el tamaño no se permiten, o el
            contenido no corresponde al tipo declarado (`FILE_CONTENT_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/files/signed-url:
    post:
      tags:
        - Archivos
      summary: Pedir un enlace temporal para ver o descargar un archivo
      description: Los documentos de verificación solo los puede pedir el administrador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_key
              properties:
                file_key:
                  type: string
                expires_in_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  default: 30
                disposition:
                  type: string
                  enum:
                    - inline
                    - attachment
                  default: inline
                download_name:
                  type: string
                  description: Nombre con el que se descarga el archivo.
      responses:
        '200':
          description: Enlace firmado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SignedUrl'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Es un documento de verificación y no eres administrador, o la llave intenta salir del almacenamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/files/download:
    get:
      tags:
        - Archivos
      summary: Descargar un archivo con su enlace firmado
      description: No pide token; la firma del enlace es la que da acceso mientras esté vigente.
      security: []
      parameters:
        - $ref: '#/components/parameters/FileKeyQuery'
        - $ref: '#/components/parameters/FileExpiresQuery'
        - $ref: '#/components/parameters/FileSignatureQuery'
        - $ref: '#/components/parameters/FileDispositionQuery'
      responses:
        '200':
          description: El archivo.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: La firma no es válida o el enlace ya venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Ruta de archivo no permitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/files/view:
    get:
      tags:
        - Archivos
      summary: Mostrar un archivo en el navegador con su enlace firmado
      description: Igual que `/api/files/download`, pero siempre lo muestra en lugar de descargarlo.
      security: []
      parameters:
        - $ref: '#/components/parameters/FileKeyQuery'
        - $ref: '#/components/parameters/FileExpiresQuery'
        - $ref: '#/components/parameters/FileSignatureQuery'
        - $ref: '#/components/parameters/FileDispositionQuery'
      responses:
        '200':
          description: El archivo.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: La firma no es válida o el enlace ya venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/files:
    delete:
      tags:
        - Archivos
      summary: Borrar un archivo
      description: Solo quien lo subió o el administrador. Los documentos de verificación, solo el administrador.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - file_key
              properties:
                file_key:
                  type: string
      responses:
        '200':
          description: Archivo borrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El archivo no es tuyo (`FILE_DELETE_FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El archivo no existe (`FILE_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Planeados · Módulos 1 y 2 (proveedor): registro y seguimiento
  # ==========================================================================

  /api/document-types:
    get:
      tags:
        - Proveedores
      summary: '[Planeado · API-12] Documentos que pide el registro'
      description: Catálogo público para armar el paso de documentos según el tipo de proveedor.
      x-estado: planeado
      x-ticket: API-12
      security: []
      parameters:
        - in: query
          name: supplier_type
          required: true
          schema:
            $ref: '#/components/schemas/SupplierType'
      responses:
        '200':
          description: Documentos activos que aplican a ese tipo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DocumentType'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/supplier-applications:
    post:
      tags:
        - Proveedores
      summary: '[Planeado · API-11] Enviar la solicitud para ser proveedor'
      description: |
        Registro web completo en una sola petición `multipart/form-data`:

        - `data`: JSON con el encargado, el negocio, los locales (dirección, horarios, categorías)
          y, opcionalmente, empleados.
        - `documents[<type_document_id>]`: un archivo por cada documento obligatorio.

        Crea la cuenta del encargado en estado `por_aprobar` y la solicitud en `pendiente`.
        Emite el evento «solicitud de proveedor enviada» (avisa al administrador y manda el correo
        de recibido).
      x-estado: planeado
      x-ticket: API-11
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/SupplierApplicationCreate'
                documents:
                  type: object
                  description: Archivos indexados por `type_document_id`, por ejemplo `documents[3]`.
                  additionalProperties:
                    type: string
                    format: binary
            encoding:
              data:
                contentType: application/json
      responses:
        '201':
          description: Solicitud recibida.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SupplierApplication'
        '400':
          description: Datos inválidos o falta un documento obligatorio (`MISSING_REQUIRED_DOCUMENT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El correo, el RFC o la identificación fiscal ya están registrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/supplier-applications/me:
    get:
      tags:
        - Proveedores
      summary: '[Planeado · API-13] Ver el estado de mi solicitud'
      description: |
        Para el sitio web del proveedor mientras está en revisión. Incluye el resultado y los
        comentarios de cada documento.

        Nota para API-13: hoy el login responde 403 `ACCOUNT_NOT_ACTIVE` a las cuentas
        `por_aprobar`. Para usar este endpoint, el login debe permitirles una sesión limitada a la
        consulta y corrección de su solicitud.
      x-estado: planeado
      x-ticket: API-13
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Solicitud del proveedor que inició sesión.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SupplierApplication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/supplier-applications/me/documents/{typeDocumentId}:
    parameters:
      - in: path
        name: typeDocumentId
        required: true
        schema:
          type: string
        description: Id del tipo de documento que se vuelve a subir.
    put:
      tags:
        - Proveedores
      summary: '[Planeado · API-12] Volver a subir un documento'
      description: Solo cuando la solicitud está en `documentacion_incompleta`. Al subir todos los rechazados, la solicitud regresa a `pendiente`.
      x-estado: planeado
      x-ticket: API-12
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                due_date:
                  type: string
                  format: date
                  description: Obligatoria si el tipo de documento pide vigencia.
      responses:
        '200':
          description: Documento reemplazado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SupplierDocument'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: La solicitud no está en `documentacion_incompleta` (`APPLICATION_NOT_EDITABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Planeados · Administración (revisión de proveedores y personal interno)
  # ==========================================================================

  /api/admin/supplier-applications:
    get:
      tags:
        - Administración
      summary: '[Planeado · API-13] Listar solicitudes de proveedor'
      x-estado: planeado
      x-ticket: API-13
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: state
          schema:
            $ref: '#/components/schemas/SupplierApplicationState'
        - in: query
          name: search
          schema:
            type: string
          description: Busca por nombre del negocio, del encargado o correo.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Solicitudes, las más antiguas primero.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SupplierApplicationSummary'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/supplier-applications/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Administración
      summary: '[Planeado · API-13] Ver el desglose de una solicitud'
      description: Encargado, negocio, locales, empleados y documentos con su revisión.
      x-estado: planeado
      x-ticket: API-13
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Solicitud completa.
          content:
            application/json:
