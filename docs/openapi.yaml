  /api/agenda:
    get:
      tags:
        - Agenda
      summary: '[API-45] Agenda de citas y bloqueos de uno o varios días'
      description: >-
        Citas (solicitudes con fecha) y bloqueos de horario, repartidos por día local de la
        sucursal, con su horario de atención. Sin parámetros es la agenda del propio técnico; el
        gerente ve toda su sucursal. Con `branch_id` (dueño, gerente o administrador) se ve toda
