                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Pagos
      summary: 'Pagos de una solicitud'
      description: |
        Pagos registrados y lo que falta. Lo ve quien puede ver la solicitud. El saldo es el total
        (`total_amount`) menos lo confirmado por el proveedor; si la solicitud está finalizada y queda
        saldo, es un adeudo (`has_debt`).
      x-estado: implementado
      x-ticket: API-37
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resumen y pagos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          summary:
                            $ref: '#/components/schemas/PaymentSummary'
                          payments:
                            type: array
                            items:
                              $ref: '#/components/schemas/Payment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Pagos
      summary: 'Registrar un pago (cliente)'
      description: |
        El cliente registra que pagó en efectivo o por transferencia un servicio ya `completada`.
        Queda `pendiente` hasta que el proveedor confirma que lo recibió; solo puede haber uno
        pendiente. Sin `amount` paga todo lo que falta; puede pagar en partes. Con el mismo
        `client_uuid` un reintento regresa el pago ya creado (200). La tarjeta todavía no está
        disponible (`PAYMENT_METHOD_UNAVAILABLE`). Avisa al técnico.
      x-estado: implementado
      x-ticket: API-37
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                method:
                  type: string
                  enum: [efectivo, transferencia]
                amount:
                  description: Opcional; mayor a 0 y hasta lo que falta, con máximo 2 decimales.
                  oneOf:
                    - type: number
                    - type: string
                reference:
                  type: string
                  maxLength: 255
                  description: Folio o referencia de la transferencia.
                client_uuid:
                  type: string
                  maxLength: 100
              required:
                - method
      responses:
        '201':
          description: Pago registrado, esperando confirmación.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Payment'
        '200':
          description: Reintento con el mismo `client_uuid`; regresa el pago existente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Payment'
        '400':
          description: |
            Datos inválidos (`VALIDATION_ERROR`), tarjeta (`PAYMENT_METHOD_UNAVAILABLE`) o monto mayor
            a lo que falta (`AMOUNT_EXCEEDS_BALANCE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            La solicitud no está finalizada (`INVALID_REQUEST_STATUS`), ya hay un pago esperando
            confirmación (`PAYMENT_PENDING`) o ya está pagada (`NOTHING_TO_PAY`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/service-requests/{id}/payments/{paymentId}/confirm:
    parameters:
      - $ref: '#/components/parameters/Id'
