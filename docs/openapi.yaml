  /api/reports/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Reportes
      summary: Cambiar el estado (Soporte)
      description: |
        Solo Soporte y Administrador. Transiciones: `pendiente` → `en_revision` | `rechazado`, y
        `en_revision` → `resuelto` | `rechazado`. Resuelto y rechazado son finales.

        - `resuelto` exige `resolution_type` y `comment` con la resolución.
        - `rechazado` exige `comment` con el motivo.
        - Al pasar a `en_revision` un reporte sin responsable, queda asignado a quien lo tomó.

        El cambio y su línea de bitácora se guardan en una sola transacción. Quien reportó recibe el aviso
        por notificación y push; el comentario queda visible para él en la bitácora.
      x-estado: implementado
      x-ticket: API-40
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeReportStatusInput'
            examples:
              tomar:
                value:
                  status: en_revision
              resolver:
                value:
                  status: resuelto
                  resolution_type: reembolso
                  comment: Se aprobó el reembolso del cobro duplicado.
              rechazar:
                value:
                  status: rechazado
                  comment: La evidencia no corresponde al servicio reportado.
      responses:
        '200':
          description: Caso actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Report'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Transición no permitida (`INVALID_REPORT_TRANSITION`) o el estado cambió al mismo tiempo (`REPORT_STATE_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

