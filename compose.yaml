# Redis para la API, en local y en el servidor: docker compose up -d redis
services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Guarda los datos en disco para que un reinicio no borre temporizadores en curso.
    command: ['redis-server', '--appendonly', 'yes']
    # Solo se publica en 127.0.0.1: la API lo alcanza en el mismo equipo y no queda expuesto a internet.
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
